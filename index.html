<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1c1917">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Manku Metal Works - SECURE OPS</title>

    <!-- LIBRARIES (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>window.react = window.React;</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@0.556.0/dist/umd/lucide-react.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Black+Ops+One&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <script>
        // THEME CONFIG
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { stencil: ["'Black Ops One'", 'cursive'], mono: ["'Courier Prime'", 'monospace'] },
                    colors: {
                        rust: 'var(--color-primary)',
                        oil: 'var(--color-bg)',
                        metal: 'var(--color-text-dim)',
                        surface: 'var(--color-surface)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: #c2410c; --color-bg: #1c1917; --color-surface: #292524; --color-text-main: #f5f5f4; --color-text-dim: #a8a29e;
            --bg-texture: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'%3E%3C/svg%3E");
        }
        /* Festival Theme Override */
        body.theme-festival { --color-primary: #fbbf24; --color-bg: #2e1065; --color-surface: #4c1d95; }

        body { background-color: var(--color-bg); background-image: var(--bg-texture); color: var(--color-text-main); font-family: 'Courier Prime', monospace; transition: background-color 0.5s, color 0.5s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- MOCK ADAPTER (Internal Logic for Demo) -->
    <script src="pwa_mock_adapter.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Camera, Calculator, Hammer, FileText, Ruler, Grid, Activity, Users, Settings, LogOut, Download, UploadCloud, AlertTriangle, Plus, Edit, X, ChevronLeft, ChevronRight, Save, Phone, Share2, Sun, Moon, StickyNote, Table, Circle, Dna, Search, User, Home, Calendar, MessageSquare, Image, Truck } = LucideReact;

        // API SERVICE (External to React for broader scope)
        const api = {
            post: async (payload) => {
                const res = await window.mockFetch('/api/exec', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(`Server Error: ${res.status}`);
                return res.json();
            },
            upload: (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024; // Constraint for GAS payload limit
                        const scaleSize = MAX_WIDTH / img.width;

                        // Only scale down if width exceeds MAX_WIDTH
                        if (img.width > MAX_WIDTH) {
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                        } else {
                            canvas.width = img.width;
                            canvas.height = img.height;
                        }

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        // Compress to ~150KB (0.7 quality usually does the trick)
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                        // Optimistic UI Update (Resolve immediately)
                        resolve(compressedBase64);

                        // Silent Background Upload with Error Handling
                        api.post({
                            action: "upload_image",
                            image: compressedBase64,
                            mimeType: "image/jpeg",
                            filename: file.name
                        }).then(() => {
                             if(window.showToast) window.showToast("Upload Synced!", "success");
                        }).catch(e => {
                             console.error("Background Upload Failed", e);
                             if(window.showToast) window.showToast("Sync Failed - Retrying...", "error");
                             // Retry logic could be added here
                        });
                    };
                    img.onerror = (e) => reject(new Error("Image Load Failed"));
                };
                reader.onerror = (error) => reject(error);
            })
        };

        // 1. FABRICATOR HUD (Camera + Horizon + Grid)
        const FabricatorHUD = ({ onClose }) => {
            const [zoom, setZoom] = useState(50);
            const [tilt, setTilt] = useState(0);
            const videoRef = useRef(null);
            const streamRef = useRef(null);

            useEffect(() => {
                const handleOr = (e) => setTilt(e.gamma || 0);
                window.addEventListener('deviceorientation', handleOr);

                navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
                    .then(s => {
                        streamRef.current = s;
                        if(videoRef.current) videoRef.current.srcObject = s;
                    })
                    .catch(e => console.log("Cam Error (Expected in iframe)", e));

                return () => {
                    window.removeEventListener('deviceorientation', handleOr);
                    if(streamRef.current) {
                        streamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const isLevel = Math.abs(tilt) <= 1;
            const lineColor = isLevel ? 'bg-green-500' : 'bg-red-500';
            const shadowColor = isLevel ? 'shadow-[0_0_10px_#22c55e]' : 'shadow-[0_0_10px_red]';

            return (
                <div className="fixed inset-0 z-50 bg-black flex items-center justify-center">
                    <video ref={videoRef} autoPlay playsInline className="absolute inset-0 w-full h-full object-cover opacity-70" />
                    <div className="absolute inset-0 pointer-events-none opacity-40"
                         style={{backgroundImage: `linear-gradient(to right, #00ff00 1px, transparent 1px), linear-gradient(to bottom, #00ff00 1px, transparent 1px)`, backgroundSize: `${zoom}px ${zoom}px`}}></div>
                    <div className={`absolute w-[120%] h-0.5 ${lineColor} ${shadowColor} transition-transform duration-100`} style={{transform: `rotate(${tilt}deg)`}}></div>
                    <div className={`absolute w-8 h-8 border-2 ${isLevel ? 'border-green-500' : 'border-red-500'} rounded-full flex items-center justify-center`}><div className={`w-1 h-1 ${lineColor}`}></div></div>
                    <div className="absolute bottom-10 flex flex-col items-center w-full gap-4 z-50">
                        <span className="bg-black/50 text-green-500 text-xs px-2">GRID: {zoom}mm | TILT: {Math.round(tilt)}°</span>
                        <input type="range" min="20" max="150" value={zoom} onChange={e=>setZoom(e.target.value)} className="w-64 accent-green-500" />
                        <button onClick={onClose} className="bg-red-600 text-white font-bold px-6 py-3 rounded-full">EXIT HUD</button>
                    </div>
                </div>
            );
        };

        // 2. TOOLS MODAL
        const ToolsModal = ({ onClose }) => {
            const [mode, setMode] = useState('PIE');
            const [res, setRes] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [notes, setNotes] = useState(localStorage.getItem('mmw_notes') || '');

            // Level State
            const [tilt, setTilt] = useState({gamma:0, beta:0});
            const [refAngle, setRefAngle] = useState({gamma:0, beta:0});

            // Grid State
            const [gridSize, setGridSize] = useState(50);

            // ShapeGen State
            const [svgParams, setSvgParams] = useState({shape:'FLANGE', w:100, h:100, od:100, id:50, holes:4, hdia:10, scale:1});

            // Notcher State
            const [notchParams, setNotchParams] = useState({tubeOd: 40, headerOd: 40, angle: 90});

            // Weight Calc State
            const [weightParams, setWeightParams] = useState({type:'PLATE', l:1000, w:1000, t:5, dia:50, wt:2});

            // Arc State
            const [arcParams, setArcParams] = useState({c:100, h:10});

            useEffect(() => {
                if (mode !== 'LEVEL') return;
                const handleOr = (e) => setTilt({gamma: e.gamma||0, beta: e.beta||0});
                window.addEventListener('deviceorientation', handleOr);
                return () => window.removeEventListener('deviceorientation', handleOr);
            }, [mode]);

            const saveNotes = (val) => {
                setNotes(val);
                localStorage.setItem('mmw_notes', val);
            };

            const calcWeight = () => {
                const density = 0.00000785; // kg/mm3 for Steel
                let vol = 0;
                const {type, l, w, t, dia, wt} = weightParams;

                if(type === 'PLATE') vol = l * w * t;
                if(type === 'TUBE') vol = (Math.PI * (dia * wt - wt * wt)) * l; // Approx Area * Length
                if(type === 'BAR') vol = (Math.PI * Math.pow(dia/2, 2)) * l;

                const weight = vol * density;
                setRes({text: `${weight.toFixed(2)} KG`, type: 'text'});
            };

            const calcArc = () => {
                const {c, h} = arcParams; // Chord, Height (Sagitta)
                if (h <= 0 || c <= 0) return;
                const r = (c*c)/(8*h) + h/2;
                const theta = 2 * Math.asin(c / (2*r)); // Radians
                const arcLen = r * theta;
                setRes({text: `R: ${r.toFixed(1)} | Arc Len: ${arcLen.toFixed(1)}`, type: 'text'});
            };

            const calcPie = (e) => {
                e.preventDefault();
                const d = new FormData(e.target);
                const angle = d.get('angle') / (d.get('seg') * 2);
                const dia = d.get('dia');
                // SVG Calculation for cut line (Simplified sine wave)
                const path = `M0,50 Q25,${50-angle} 50,50 T100,50`;
                setRes({text: `CUT ANGLE: ${angle.toFixed(1)}°`, type: 'pie', angle, dia});
            };

            const calcTri = (e) => {
                e.preventDefault();
                const d = new FormData(e.target);
                const a = parseFloat(d.get('a'));
                const b = parseFloat(d.get('b'));
                const hyp = Math.sqrt(a*a + b*b);
                setRes({text: `HYPOTENUSE: ${hyp.toFixed(2)}`, type: 'text'});
            };

            const calcRad = (e) => {
                e.preventDefault();
                const d = new FormData(e.target);
                const val = parseFloat(d.get('val'));
                const type = d.get('type');
                let r=0, dia=0, circ=0;

                if(type === 'RAD') { r = val; dia = r*2; circ = 2*Math.PI*r; }
                if(type === 'DIA') { dia = val; r = dia/2; circ = Math.PI*dia; }
                if(type === 'CIRC') { circ = val; dia = circ/Math.PI; r = dia/2; }

                setRes({text: `R: ${r.toFixed(2)} | D: ${dia.toFixed(2)} | C: ${circ.toFixed(2)}`, type: 'text'});
            };

            const calcConv = (e) => {
                e.preventDefault();
                const d = new FormData(e.target);
                const val = d.get('val'); // String to handle fraction input potentially later
                const numVal = parseFloat(val);
                const from = d.get('from');
                let out = 0;
                let unit = '';
                let extra = '';

                if(from === 'MM_INCH') {
                    out = numVal / 25.4;
                    unit = 'inch';
                    // Fraction Logic
                    const frac = out - Math.floor(out);
                    const denoms = [2, 4, 8, 16, 32];
                    for(let den of denoms) {
                        if(Math.round(frac * den) / den === Math.round(frac*100)/100) { // Simple check
                             // Not precise but OK for visual
                        }
                    }
                    // Robust closest fraction:
                    const den = 16;
                    const num = Math.round(frac * den);
                    if(num > 0) extra = ` (${Math.floor(out)} ${num}/${den})`;
                }
                if(from === 'INCH_MM') { out = numVal * 25.4; unit = 'mm'; }
                if(from === 'KG_LBS') { out = numVal * 2.20462; unit = 'lbs'; }
                if(from === 'LBS_KG') { out = numVal / 2.20462; unit = 'kg'; }
                setRes({text: `${out.toFixed(3)} ${unit}${extra}`, type: 'text'});
            };

            const downloadSvg = (id, name) => {
                const svgData = document.getElementById(id).outerHTML;
                const blob = new Blob([svgData], {type:"image/svg+xml;charset=utf-8"});
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = name;
                document.body.appendChild(link);
                link.click();
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploading(true);
                api.upload(file)
                    .then(base64 => {
                        setRes({text: "Image Compressed & Uploading...", type: 'image', img: base64});
                        setUploading(false);
                    })
                    .catch(err => {
                        console.error(err);
                        setRes({text: "Upload Failed", type: 'error'});
                        setUploading(false);
                    });
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                    <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative h-[80vh] overflow-y-auto">
                        <button onClick={onClose} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                        <h2 className="font-stencil text-2xl text-rust mb-4">FABRICATOR SUITE</h2>
                        <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
                            {['PIE', 'TRIANGLE', 'RADIUS', 'LEVEL', 'GRID', 'CONVERT', 'SVG', 'NOTCHER', 'WEIGHT', 'ARC', 'TAP', 'NOTES', 'UPLOAD'].map(m => <button key={m} onClick={()=>{setMode(m);setRes(null)}} className={`px-2 py-1 text-xs font-bold whitespace-nowrap ${mode===m?'bg-rust text-black':'bg-surface border border-metal'}`}>{m}</button>)}
                        </div>

                        {mode === 'WEIGHT' && (
                            <div className="space-y-4">
                                <div className="flex gap-2">
                                    {['PLATE', 'TUBE', 'BAR'].map(t => <button key={t} onClick={()=>setWeightParams({...weightParams, type:t})} className={`flex-1 py-1 text-xs border ${weightParams.type===t?'border-rust text-rust':'border-metal text-metal'}`}>{t}</button>)}
                                </div>
                                {weightParams.type === 'PLATE' && (
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <label>Length (mm) <input type="number" value={weightParams.l} onChange={e=>setWeightParams({...weightParams, l:e.target.value})} className="w-full bg-black border border-metal p-2" /></label>
                                        <label>Width (mm) <input type="number" value={weightParams.w} onChange={e=>setWeightParams({...weightParams, w:e.target.value})} className="w-full bg-black border border-metal p-2" /></label>
                                        <label>Thk (mm) <input type="number" value={weightParams.t} onChange={e=>setWeightParams({...weightParams, t:e.target.value})} className="w-full bg-black border border-metal p-2" /></label>
                                    </div>
                                )}
                                {weightParams.type === 'TUBE' && (
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <label>Length (mm) <input type="number" value={weightParams.l} onChange={e=>setWeightParams({...weightParams, l:e.target.value})} className="w-full bg-black border border-metal p-2" /></label>
                                        <label>OD (mm) <input type="number" value={weightParams.dia} onChange={e=>setWeightParams({...weightParams, dia:e.target.value})} className="w-full bg-black border border-metal p-2" /></label>
                                        <label>Wall (mm) <input type="number" value={weightParams.wt} onChange={e=>setWeightParams({...weightParams, wt:e.target.value})} className="w-full bg-black border border-metal p-2" /></label>
                                    </div>
                                )}
                                {weightParams.type === 'BAR' && (
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <label>Length (mm) <input type="number" value={weightParams.l} onChange={e=>setWeightParams({...weightParams, l:e.target.value})} className="w-full bg-black border border-metal p-2" /></label>
                                        <label>Dia (mm) <input type="number" value={weightParams.dia} onChange={e=>setWeightParams({...weightParams, dia:e.target.value})} className="w-full bg-black border border-metal p-2" /></label>
                                    </div>
                                )}
                                <button onClick={calcWeight} className="w-full bg-rust py-2 font-bold text-black">CALCULATE WEIGHT</button>
                            </div>
                        )}

                        {mode === 'ARC' && (
                            <div className="space-y-4">
                                <div className="text-xs text-metal">Enter Chord Length (width) and Height (Sagitta) to find Radius.</div>
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <label>Chord (C) <input type="number" value={arcParams.c} onChange={e=>setArcParams({...arcParams, c:parseFloat(e.target.value)})} className="w-full bg-black border border-metal p-2" /></label>
                                    <label>Height (H) <input type="number" value={arcParams.h} onChange={e=>setArcParams({...arcParams, h:parseFloat(e.target.value)})} className="w-full bg-black border border-metal p-2" /></label>
                                </div>
                                <button onClick={calcArc} className="w-full bg-rust py-2 font-bold text-black">CALCULATE ARC</button>
                            </div>
                        )}

                        {mode === 'TAP' && (
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs text-left">
                                    <thead><tr className="border-b border-metal text-rust"><th>TAP</th><th>DRILL (mm)</th></tr></thead>
                                    <tbody className="divide-y divide-metal/30">
                                        <tr><td>M3 x 0.5</td><td>2.5</td></tr>
                                        <tr><td>M4 x 0.7</td><td>3.3</td></tr>
                                        <tr><td>M5 x 0.8</td><td>4.2</td></tr>
                                        <tr><td>M6 x 1.0</td><td>5.0</td></tr>
                                        <tr><td>M8 x 1.25</td><td>6.8</td></tr>
                                        <tr><td>M10 x 1.5</td><td>8.5</td></tr>
                                        <tr><td>M12 x 1.75</td><td>10.2</td></tr>
                                        <tr><td>M16 x 2.0</td><td>14.0</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {mode === 'NOTES' && (
                            <div className="h-full flex flex-col">
                                <textarea value={notes} onChange={e=>saveNotes(e.target.value)} className="flex-1 w-full bg-black border border-metal p-2 text-white font-mono text-sm resize-none" placeholder="Quick notes (saved automatically)..."></textarea>
                            </div>
                        )}

                        {mode === 'UPLOAD' && (
                            <div className="space-y-4 text-center">
                                <h3 className="font-bold text-white">UPLOAD PHOTO</h3>
                                <div className="border-2 border-dashed border-metal p-8 relative">
                                    <input type="file" accept="image/*" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    {uploading ? <div className="text-rust animate-pulse">COMPRESSING...</div> : <div className="text-metal">Tap to Select Image</div>}
                                </div>
                                <p className="text-xs text-metal">Auto-compressed to 1024px width before upload.</p>
                            </div>
                        )}

                        {mode === 'PIE' && (
                            <div className="space-y-4">
                                <form onSubmit={calcPie} className="space-y-3">
                                    <input name="dia" placeholder="Pipe Dia (OD)" className="w-full bg-black border border-metal p-2" />
                                    <input name="angle" placeholder="Bend Angle (Total)" className="w-full bg-black border border-metal p-2" />
                                    <input name="seg" placeholder="Segments" className="w-full bg-black border border-metal p-2" />
                                    <button className="w-full bg-rust py-2 font-bold text-black">CALCULATE</button>
                                </form>
                                {res?.type === 'pie' && (
                                    <div className="border border-metal p-4 bg-black flex flex-col items-center">
                                        <svg viewBox="0 0 100 100" className="w-full h-32 stroke-green-500 fill-none stroke-2">
                                            {/* Simple visualization of cut line */}
                                            <rect x="10" y="20" width="80" height="60" stroke="#333" />
                                            <path d={`M10,80 L90,80 L90,${80 - (res.angle*2)} L10,80`} fill="rgba(0,255,0,0.2)" />
                                            <text x="50" y="50" fill="white" fontSize="10" textAnchor="middle">CUT SIDE VIEW</text>
                                        </svg>
                                    </div>
                                )}
                            </div>
                        )}

                        {mode === 'TRIANGLE' && (
                            <form onSubmit={calcTri} className="space-y-3">
                                <input name="a" placeholder="Side A (Length)" className="w-full bg-black border border-metal p-2" />
                                <input name="b" placeholder="Side B (Height)" className="w-full bg-black border border-metal p-2" />
                                <button className="w-full bg-rust py-2 font-bold text-black">CALCULATE HYP</button>
                            </form>
                        )}

                        {mode === 'RADIUS' && (
                            <form onSubmit={calcRad} className="space-y-3">
                                <div className="flex gap-2">
                                    <input name="val" placeholder="Value" className="flex-1 bg-black border border-metal p-2" />
                                    <select name="type" className="bg-black border border-metal p-2 text-white">
                                        <option value="RAD">Radius</option>
                                        <option value="DIA">Diameter</option>
                                        <option value="CIRC">Circumference</option>
                                    </select>
                                </div>
                                <button className="w-full bg-rust py-2 font-bold text-black">CALCULATE ALL</button>
                            </form>
                        )}

                        {mode === 'CONVERT' && (
                            <form onSubmit={calcConv} className="space-y-3">
                                <div className="flex gap-2">
                                    <input name="val" placeholder="Value" className="flex-1 bg-black border border-metal p-2" />
                                    <select name="from" className="bg-black border border-metal p-2 text-white">
                                        <option value="MM_INCH">mm to Inch</option>
                                        <option value="INCH_MM">Inch to mm</option>
                                        <option value="KG_LBS">kg to lbs</option>
                                        <option value="LBS_KG">lbs to kg</option>
                                    </select>
                                </div>
                                <button className="w-full bg-rust py-2 font-bold text-black">CONVERT</button>
                            </form>
                        )}

                        {mode === 'LEVEL' && (
                            <div className="text-center space-y-4">
                                <div className="relative w-48 h-48 mx-auto border-4 border-metal rounded-full bg-black flex items-center justify-center overflow-hidden">
                                    <div className="absolute inset-0 bg-rust/10"></div>

                                    {/* Horizon Line Visualization */}
                                    <div className={`absolute w-[120%] h-1 ${Math.abs(tilt.gamma - refAngle.gamma) < 1 ? 'bg-green-500 shadow-[0_0_10px_#22c55e]' : 'bg-red-500'} transition-transform duration-100`}
                                         style={{transform: `rotate(${tilt.gamma - refAngle.gamma}deg)`}}></div>

                                    <div className="w-32 h-32 border border-metal/30 rounded-full z-10 pointer-events-none"></div>

                                    {/* Bubble Visualization (Optional secondary) */}
                                    <div className="absolute w-4 h-4 bg-white/50 rounded-full z-0"
                                         style={{
                                             transform: `translate(${(tilt.gamma - refAngle.gamma) * 2}px, ${(tilt.beta - refAngle.beta) * 2}px)`
                                         }}></div>
                                </div>
                                <div className="font-mono text-xl">
                                    ANGLE: {(tilt.gamma - refAngle.gamma).toFixed(1)}°
                                </div>

                                        ))}
                                    </div>
                                    <form onSubmit={createVendor} className="flex flex-col gap-2 mt-4 pt-4 border-t border-metal">
                                        <h4 className="text-[10px] font-bold">ADD VENDOR</h4>
                                        <input name="name" placeholder="Vendor Name" required className="bg-black border border-metal p-2 text-white" />
                                        <div className="flex gap-2">
                                            <input name="contact" placeholder="Contact Person" required className="w-1/2 bg-black border border-metal p-2 text-white" />
                                            <input name="phone" placeholder="Phone" required className="w-1/2 bg-black border border-metal p-2 text-white" />
                                        </div>
                                        <input name="material" placeholder="Material Type" required className="bg-black border border-metal p-2 text-white" />
                                        <button className="bg-metal/20 hover:bg-rust text-white py-2 font-bold text-xs">SAVE VENDOR</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {selectedClient && (
                         <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative max-h-[80vh] overflow-y-auto">
                                <button onClick={()=>setSelectedClient(null)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-1">{selectedClient.company}</h2>
                                <p className="text-metal text-sm mb-4">{selectedClient.name} | {selectedClient.phone}</p>
                                <h3 className="font-bold border-b border-metal mb-2">JOB HISTORY</h3>
                                <div className="space-y-2">
                                    {selectedClient.history.map(jid => {
                                        const job = data.jobs.find(j => j.id === jid) || {id: jid, project: "Archived Job", date: "N/A", status:"DONE"};
                                        return (
                                            <div key={jid} onClick={()=>{setJobDetail(job)}} className="bg-black/20 p-2 text-sm cursor-pointer hover:bg-black/40 border border-transparent hover:border-rust transition-colors">
                                                <div className="flex justify-between font-bold"><span>{job.project}</span><span>{job.date}</span></div>
                                                <div className="text-xs text-metal">#{jid} - {job.status}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {editClient && (
                        <div className="fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative">
                                <button onClick={()=>setEditClient(null)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-4">EDIT CLIENT</h2>
                                <form onSubmit={updateClient} className="space-y-3">
                                    <input name="name" defaultValue={editClient.name} placeholder="Name" className="w-full bg-black border border-metal p-2 text-white" />
                                    <input name="company" defaultValue={editClient.company} placeholder="Company" className="w-full bg-black border border-metal p-2 text-white" />
                                    <input name="phone" defaultValue={editClient.phone} placeholder="Phone" className="w-full bg-black border border-metal p-2 text-white" />
                                    <button className="w-full bg-rust py-3 font-bold text-black mt-4">SAVE CHANGES</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showAddShowcase && (
                        <div className="fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative">
                                <button onClick={()=>setShowAddShowcase(false)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-4">ADD PROJECT</h2>
                                <form onSubmit={addShowcaseItem} className="space-y-3">
                                    <input name="title" placeholder="Project Title" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <select name="tag" className="w-full bg-black border border-metal p-2 text-white">
                                        <option value="Gate">Gate</option>
                                        <option value="Grill">Grill</option>
                                        <option value="Industrial">Industrial</option>
                                    </select>
                                    <label className="block text-xs font-bold text-metal mb-1">Cover Image</label>
                                    <input type="file" name="image" accept="image/*" required className="w-full text-xs text-metal file:bg-rust file:text-black file:border-0 file:px-2 file:py-1" />
                                    <button className="w-full bg-rust py-3 font-bold text-black mt-4">UPLOAD & CREATE</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {jobDetail && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative max-h-[90vh] overflow-y-auto">
                                <button onClick={()=>setJobDetail(null)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <div className="mb-6">
                                    <span onClick={()=>updateStatus(jobDetail, jobDetail.status==='PENDING'?'ACTIVE':jobDetail.status==='ACTIVE'?'DONE':'PENDING')} className="bg-rust text-black px-2 py-1 text-xs font-bold cursor-pointer hover:bg-white">{jobDetail.status}</span>
                                    <h2 className="font-stencil text-3xl mt-2">{jobDetail.project}</h2>
                                    <p className="text-metal">#{jobDetail.id}</p>
                                </div>
                                <div className="space-y-4 mb-8">
                                    <div className="flex justify-between border-b border-metal/30 pb-2">
                                        <span className="text-metal">CLIENT</span>
                                        <span className="font-bold text-right">{jobDetail.client}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-metal/30 pb-2">
                                        <span className="text-metal">DATE</span>
                                        <span className="font-bold text-right">{jobDetail.date}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-metal/30 pb-2">
                                        <span className="text-metal">EST. COST</span>
                                        <span className="font-bold text-right font-mono text-green-500">₹{jobDetail.cost}</span>
                                    </div>

                                    {/* Work Log */}
                                    <div className="border-t border-metal/30 pt-4">
                                        <h4 className="font-bold text-xs mb-2">WORK HOURS</h4>
                                        <div className="space-y-1 mb-2">
                                            {(jobDetail.workLog || []).map((w, i) => (
                                                <div key={i} className="text-xs flex justify-between"><span>{w.activity}</span><span>{w.hours} hr</span></div>
                                            ))}
                                            {(jobDetail.workLog || []).length > 0 && (
                                                <div className="text-xs flex justify-between border-t border-metal/20 pt-1 font-bold text-rust">
                                                    <span>TOTAL</span>
                                                    <span>{(jobDetail.workLog || []).reduce((a,b)=>a+parseFloat(b.hours),0)} hr</span>
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex gap-2">
                                            <select id="work-select" className="bg-black border border-metal text-white text-xs w-2/3">
                                                <option value="Cutting">Cutting</option>
                                                <option value="Welding">Welding</option>
                                                <option value="Grinding">Grinding</option>
                                                <option value="Finishing">Finishing</option>
                                                <option value="Installation">Installation</option>
                                                <option value="Other">Other</option>
                                            </select>
                                            <input id="work-hrs" type="number" placeholder="Hrs" className="bg-black border border-metal text-white text-xs w-1/3" />
                                            <button onClick={()=>{
                                                const activity = document.getElementById('work-select').value;
                                                const hours = document.getElementById('work-hrs').value;
                                                if(hours) updateJobDetails('workLog', {activity, hours});
                                            }} className="bg-rust text-black px-2 font-bold">+</button>
                                        </div>
                                    </div>

                                    {/* Material Log */}
                                    <div className="border-t border-metal/30 pt-4">
                                        <h4 className="font-bold text-xs mb-2">MATERIAL CONSUMPTION</h4>
                                        <div className="space-y-1 mb-2">
                                            {jobDetail.materialLog && jobDetail.materialLog.map((m, i) => (
                                                <div key={i} className="text-xs flex justify-between"><span>{m.item}</span><span>{m.qty}</span></div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <select id="mat-select" className="bg-black border border-metal text-white text-xs w-2/3">
                                                {data.inventory.map(i => <option key={i.id} value={i.item}>{i.item}</option>)}
                                            </select>
                                            <input id="mat-qty" placeholder="Qty" className="bg-black border border-metal text-white text-xs w-1/3" />
                                            <button onClick={()=>{
                                                const item = document.getElementById('mat-select').value;
                                                const qty = document.getElementById('mat-qty').value;
                                                if(qty) updateJobDetails('materialLog', {item, qty});
                                            }} className="bg-rust text-black px-2 font-bold">+</button>
                                        </div>
                                    </div>

                                    {/* Financials */}
                                    <div className="border-t border-metal/30 pt-4">
                                        <h4 className="font-bold text-xs mb-2">FINANCIALS</h4>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span>Advances</span>
                                            <span>₹{jobDetail.advances ? jobDetail.advances.reduce((a,b)=>a+parseInt(b.amount),0) : 0}</span>
                                        </div>
                                        <div className="flex gap-2 mb-2">
                                            <input id="adv-amt" placeholder="Advance Amount" className="bg-black border border-metal text-white text-xs w-2/3" />
                                            <button onClick={()=>{
                                                const amount = document.getElementById('adv-amt').value;
                                                if(amount) updateJobDetails('advances', {amount, date: new Date().toISOString().split('T')[0]});
                                            }} className="bg-rust text-black px-2 font-bold text-xs">ADD</button>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={()=>saveTemplate(jobDetail)} className="w-full bg-black border border-rust text-rust py-2 mb-4 hover:bg-rust hover:text-black">SAVE AS TEMPLATE</button>
                                <div className="flex gap-2">
                                    <button onClick={()=>{setEditJob(jobDetail)}} className="flex-1 bg-surface border border-metal text-white py-3 hover:bg-black">EDIT</button>
                                    <button onClick={()=>{setQuoteJob(jobDetail); setJobDetail(null)}} className="flex-1 bg-white text-black font-bold py-3 hover:bg-gray-200">QUOTE</button>
                                    <button onClick={()=>{
                                        const text = `*JOB UPDATE*\nProject: ${jobDetail.project}\nStatus: ${jobDetail.status}\nCost: ₹${jobDetail.cost}`;
                                        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                                    }} className="bg-green-600 text-black px-4 py-3"><Share2 size={20}/></button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editJob && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative">
                                <button onClick={()=>setEditJob(null)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-4">EDIT JOB: {editJob.id}</h2>
                                <form onSubmit={updateJob} className="space-y-3">
                                    <label className="text-xs text-metal">PROJECT NAME</label>
                                    <input name="project" defaultValue={editJob.project} className="w-full bg-black border border-metal p-2 text-white" />
                                    <label className="text-xs text-metal">EST. COST</label>
                                    <input name="cost" type="number" defaultValue={editJob.cost} className="w-full bg-black border border-metal p-2 text-white" />
                                    <label className="text-xs text-metal">STATUS</label>
                                    <select name="status" defaultValue={editJob.status} className="w-full bg-black border border-metal p-2 text-white">
                                        <option value="PENDING">PENDING</option>
                                        <option value="ACTIVE">ACTIVE</option>
                                        <option value="DONE">DONE</option>
                                    </select>
                                    <button className="w-full bg-rust py-3 font-bold text-black mt-4">SAVE CHANGES</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showNewJob && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative">
                                <button onClick={()=>setShowNewJob(false)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-4">NEW JOB</h2>
                                <form onSubmit={createJob} className="space-y-3">
                                    <select onChange={e=>{
                                        const t = data.templates.find(t=>t.id===e.target.value);
                                        if(t) {
                                            document.getElementsByName('project')[0].value = t.project;
                                            document.getElementsByName('cost')[0].value = t.cost;
                                        }
                                    }} className="w-full bg-black border border-metal p-2 text-white mb-4">
                                        <option value="">Load Template...</option>
                                        {data.templates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                    <input name="project" placeholder="Project Name" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <select name="client" required className="w-full bg-black border border-metal p-2 text-white">
                                        <option value="">Select Client...</option>
                                        {data.clients.map(c => <option key={c.id} value={c.name}>{c.name} ({c.company})</option>)}
                                    </select>
                                    <input name="cost" type="number" placeholder="Est. Cost" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <button className="w-full bg-rust py-3 font-bold text-black mt-4">CREATE JOB</button>
                                </form>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 bg-surface border-t-2 border-rust p-4 flex justify-around no-print">
                        {user?.role === 'ADMIN' && (
                            <>
                                <button onClick={()=>setView('DASH')} className={view==='DASH'?'text-rust':'text-metal'}><Activity /></button>
                                <button onClick={()=>setView('CLIENTS')} className={view==='CLIENTS'?'text-rust':'text-metal'}><Users /></button>
                                <button onClick={()=>setView('INV')} className={view==='INV'?'text-rust':'text-metal'}><Hammer /></button>
                                <button onClick={()=>setView('SHOWCASE')} className={view==='SHOWCASE'?'text-rust':'text-metal'}><Image /></button>
                                <button onClick={()=>setView('SETTINGS')} className={view==='SETTINGS'?'text-rust':'text-metal'}><Settings /></button>
                            </>
                        )}
                        {user?.role === 'CLIENT' && (
                            <>
                                <button onClick={()=>setView('CLIENT_HOME')} className={view==='CLIENT_HOME'?'text-rust':'text-metal flex flex-col items-center gap-1'}><Home size={20}/><span className="text-[10px]">Home</span></button>
                                <button onClick={()=>setView('MY_JOBS')} className={view==='MY_JOBS'?'text-rust':'text-metal flex flex-col items-center gap-1'}><FileText size={20}/><span className="text-[10px]">Orders</span></button>
                                <button onClick={()=>setView('SETTINGS')} className={view==='SETTINGS'?'text-rust':'text-metal flex flex-col items-center gap-1'}><Settings size={20}/><span className="text-[10px]">Settings</span></button>
                            </>
                        )}
                        {!user && (
                            <>
                                <button onClick={()=>setView('VISITOR')} className={view==='VISITOR'?'text-rust':'text-metal flex flex-col items-center gap-1'}><Home size={20}/><span className="text-[10px]">Home</span></button>
                                <button onClick={()=>setView('SHOWCASE')} className={view==='SHOWCASE'?'text-rust':'text-metal flex flex-col items-center gap-1'}><Image size={20}/><span className="text-[10px]">Gallery</span></button>
                            </>
                        )}
                    </nav>

                    {loginOpen && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-sm p-6 relative">
                                <button onClick={()=>setLoginOpen(false)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-4">LOGIN</h2>
                                <form onSubmit={(e)=>{login(e); setLoginOpen(false);}} className="space-y-4">
                                    <input name="user" type="tel" placeholder="Client ID / Phone" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <input name="pass" type="password" placeholder="Password" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <button className="w-full bg-rust py-3 font-bold text-black">ACCESS PORTAL</button>
                                </form>
                                <div className="text-center text-xs text-metal mt-4">
                                    <p className="cursor-pointer hover:text-rust" onClick={()=>alert("Please contact admin to reset password.")}>Forgot Password?</p>
                                    <div className="mt-2 opacity-50">
                                        <p>Admin: admin / admin</p>
                                        <p>Client: 919999999999 / 123</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {hud && <FabricatorHUD onClose={()=>setHud(false)} />}
                    {tools && <ToolsModal onClose={()=>setTools(false)} />}
                    {quoteJob && <QuoteModal job={quoteJob} onClose={()=>setQuoteJob(null)} />}

                    {toast && (
                        <div className={`fixed bottom-20 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full font-bold shadow-lg z-[100] ${toast.type==='error'?'bg-red-600 text-white':'bg-green-500 text-black'}`}>
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
