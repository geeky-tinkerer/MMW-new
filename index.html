<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1c1917">
    <title>Manku Metal Works - SECURE OPS</title>

    <!-- LIBRARIES (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>window.react = window.React;</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@0.556.0/dist/umd/lucide-react.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Black+Ops+One&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <script>
        // THEME CONFIG
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { stencil: ["'Black Ops One'", 'cursive'], mono: ["'Courier Prime'", 'monospace'] },
                    colors: {
                        rust: 'var(--color-primary)',
                        oil: 'var(--color-bg)',
                        metal: 'var(--color-text-dim)',
                        surface: 'var(--color-surface)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: #c2410c; --color-bg: #1c1917; --color-surface: #292524; --color-text-main: #f5f5f4; --color-text-dim: #a8a29e;
            --bg-texture: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'%3E%3C/svg%3E");
        }
        /* Festival Theme Override */
        body.theme-festival { --color-primary: #fbbf24; --color-bg: #2e1065; --color-surface: #4c1d95; }

        body { background-color: var(--color-bg); background-image: var(--bg-texture); color: var(--color-text-main); font-family: 'Courier Prime', monospace; transition: background-color 0.5s, color 0.5s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- API ADAPTER (Real Backend Switch) -->
    <script src="api.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Camera, Calculator, Hammer, FileText, Ruler, Grid, Activity, Users, Settings, LogOut, Download } = LucideReact;

        // 1. FABRICATOR HUD (Camera + Horizon + Grid)
        const FabricatorHUD = ({ onClose }) => {
            const [zoom, setZoom] = useState(50);
            const [tilt, setTilt] = useState(0);
            const videoRef = useRef(null);
            const streamRef = useRef(null);

            useEffect(() => {
                const handleOr = (e) => setTilt(e.gamma || 0);
                window.addEventListener('deviceorientation', handleOr);

                navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
                    .then(s => {
                        streamRef.current = s;
                        if(videoRef.current) videoRef.current.srcObject = s;
                    })
                    .catch(e => console.log("Cam Error (Expected in iframe)", e));

                return () => {
                    window.removeEventListener('deviceorientation', handleOr);
                    if(streamRef.current) {
                        streamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const isLevel = Math.abs(tilt) <= 1;
            const lineColor = isLevel ? 'bg-green-500' : 'bg-red-500';
            const shadowColor = isLevel ? 'shadow-[0_0_10px_#22c55e]' : 'shadow-[0_0_10px_red]';

            return (
                <div className="fixed inset-0 z-50 bg-black flex items-center justify-center">
                    <video ref={videoRef} autoPlay playsInline className="absolute inset-0 w-full h-full object-cover opacity-70" />
                    <div className="absolute inset-0 pointer-events-none opacity-40"
                         style={{backgroundImage: `linear-gradient(to right, #00ff00 1px, transparent 1px), linear-gradient(to bottom, #00ff00 1px, transparent 1px)`, backgroundSize: `${zoom}px ${zoom}px`}}></div>
                    <div className={`absolute w-[120%] h-0.5 ${lineColor} ${shadowColor} transition-transform duration-100`} style={{transform: `rotate(${tilt}deg)`}}></div>
                    <div className={`absolute w-8 h-8 border-2 ${isLevel ? 'border-green-500' : 'border-red-500'} rounded-full flex items-center justify-center`}><div className={`w-1 h-1 ${lineColor}`}></div></div>
                    <div className="absolute bottom-10 flex flex-col items-center w-full gap-4 z-50">
                        <span className="bg-black/50 text-green-500 text-xs px-2">GRID: {zoom}mm | TILT: {Math.round(tilt)}°</span>
                        <input type="range" min="20" max="150" value={zoom} onChange={e=>setZoom(e.target.value)} className="w-64 accent-green-500" />
                        <button onClick={onClose} className="bg-red-600 text-white font-bold px-6 py-3 rounded-full">EXIT HUD</button>
                    </div>
                </div>
            );
        };

        // 2. TOOLS MODAL (Engineering Hub Upgrade)
        const ToolsModal = ({ onClose, activeJobs, onSaveCalculation }) => {
            const [mode, setMode] = useState('PIE');
            const [res, setRes] = useState(null);
            const [selectedJob, setSelectedJob] = useState("");

            // Level State
            const [tilt, setTilt] = useState({gamma:0, beta:0});
            const [refAngle, setRefAngle] = useState({gamma:0, beta:0});

            // Grid State
            const [gridSize, setGridSize] = useState(50);

            // ShapeGen State
            const [svgParams, setSvgParams] = useState({shape:'FLANGE', w:100, h:100, od:100, id:50, holes:4, hdia:10, scale:1});

            // Notcher State
            const [notchParams, setNotchParams] = useState({tubeOd: 40, headerOd: 40, angle: 90});

            useEffect(() => {
                if (mode !== 'LEVEL') return;
                const handleOr = (e) => setTilt({gamma: e.gamma||0, beta: e.beta||0});
                window.addEventListener('deviceorientation', handleOr);
                return () => window.removeEventListener('deviceorientation', handleOr);
            }, [mode]);

            const handleSave = () => {
                if (!selectedJob) { alert("Select a Job to save this calculation!"); return; }
                if (!res) return;
                onSaveCalculation(selectedJob, { type: mode, result: res.text, params: res.params, date: new Date().toISOString() });
            };

            const calcPie = (e) => {
                e.preventDefault();
                const d = new FormData(e.target);
                const angle = d.get('angle') / (d.get('seg') * 2);
                const dia = d.get('dia');
                // SVG Calculation for cut line (Simplified sine wave)
                setRes({text: `CUT ANGLE: ${angle.toFixed(1)}°`, type: 'pie', angle, dia, params: {dia, angle: d.get('angle'), seg: d.get('seg')}});
            };

            const calcTri = (e) => {
                e.preventDefault();
                const d = new FormData(e.target);
                const a = parseFloat(d.get('a'));
                const b = parseFloat(d.get('b'));
                const hyp = Math.sqrt(a*a + b*b);
                setRes({text: `HYPOTENUSE: ${hyp.toFixed(2)}`, type: 'text', params: {a, b, hyp}});
            };

            const calcRad = (e) => {
                e.preventDefault();
                const d = new FormData(e.target);
                const val = parseFloat(d.get('val'));
                const type = d.get('type');
                let r=0, dia=0, circ=0;

                if(type === 'RAD') { r = val; dia = r*2; circ = 2*Math.PI*r; }
                if(type === 'DIA') { dia = val; r = dia/2; circ = Math.PI*dia; }
                if(type === 'CIRC') { circ = val; dia = circ/Math.PI; r = dia/2; }

                setRes({text: `R: ${r.toFixed(2)} | D: ${dia.toFixed(2)} | C: ${circ.toFixed(2)}`, type: 'text'});
            };

            const calcConv = (e) => {
                e.preventDefault();
                const d = new FormData(e.target);
                const val = parseFloat(d.get('val'));
                const from = d.get('from');
                let out = 0;
                let unit = '';
                if(from === 'MM_INCH') { out = val / 25.4; unit = 'inch'; }
                if(from === 'INCH_MM') { out = val * 25.4; unit = 'mm'; }
                if(from === 'KG_LBS') { out = val * 2.20462; unit = 'lbs'; }
                if(from === 'LBS_KG') { out = val / 2.20462; unit = 'kg'; }
                setRes({text: `${out.toFixed(3)} ${unit}`, type: 'text'});
            };

            const downloadSvg = (id, name) => {
                const svgData = document.getElementById(id).outerHTML;
                const blob = new Blob([svgData], {type:"image/svg+xml;charset=utf-8"});
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = name;
                document.body.appendChild(link);
                link.click();
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                    <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative h-[80vh] overflow-y-auto">
                        <button onClick={onClose} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                        <h2 className="font-stencil text-2xl text-rust mb-4">FABRICATOR SUITE</h2>
                        <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
                            {['PIE', 'TRIANGLE', 'RADIUS', 'LEVEL', 'GRID', 'CONVERT', 'SVG', 'NOTCHER'].map(m => <button key={m} onClick={()=>{setMode(m);setRes(null)}} className={`px-2 py-1 text-xs font-bold whitespace-nowrap ${mode===m?'bg-rust text-black':'bg-surface border border-metal'}`}>{m}</button>)}
                        </div>

                        {mode === 'PIE' && (
                            <div className="space-y-4">
                                <form onSubmit={calcPie} className="space-y-3">
                                    <input name="dia" placeholder="Pipe Dia (OD)" className="w-full bg-black border border-metal p-2" />
                                    <input name="angle" placeholder="Bend Angle (Total)" className="w-full bg-black border border-metal p-2" />
                                    <input name="seg" placeholder="Segments" className="w-full bg-black border border-metal p-2" />
                                    <button className="w-full bg-rust py-2 font-bold text-black">CALCULATE</button>
                                </form>
                                {res?.type === 'pie' && (
                                    <div className="border border-metal p-4 bg-black flex flex-col items-center">
                                        <svg viewBox="0 0 100 100" className="w-full h-32 stroke-green-500 fill-none stroke-2">
                                            {/* Simple visualization of cut line */}
                                            <rect x="10" y="20" width="80" height="60" stroke="#333" />
                                            <path d={`M10,80 L90,80 L90,${80 - (res.angle*2)} L10,80`} fill="rgba(0,255,0,0.2)" />
                                            <text x="50" y="50" fill="white" fontSize="10" textAnchor="middle">CUT SIDE VIEW</text>
                                        </svg>
                                    </div>
                                )}
                            </div>
                        )}

                        {mode === 'TRIANGLE' && (
                            <form onSubmit={calcTri} className="space-y-3">
                                <input name="a" placeholder="Side A (Length)" className="w-full bg-black border border-metal p-2" />
                                <input name="b" placeholder="Side B (Height)" className="w-full bg-black border border-metal p-2" />
                                <button className="w-full bg-rust py-2 font-bold text-black">CALCULATE HYP</button>
                            </form>
                        )}

                        {mode === 'RADIUS' && (
                            <form onSubmit={calcRad} className="space-y-3">
                                <div className="flex gap-2">
                                    <input name="val" placeholder="Value" className="flex-1 bg-black border border-metal p-2" />
                                    <select name="type" className="bg-black border border-metal p-2 text-white">
                                        <option value="RAD">Radius</option>
                                        <option value="DIA">Diameter</option>
                                        <option value="CIRC">Circumference</option>
                                    </select>
                                </div>
                                <button className="w-full bg-rust py-2 font-bold text-black">CALCULATE ALL</button>
                            </form>
                        )}

                        {mode === 'CONVERT' && (
                            <form onSubmit={calcConv} className="space-y-3">
                                <div className="flex gap-2">
                                    <input name="val" placeholder="Value" className="flex-1 bg-black border border-metal p-2" />
                                    <select name="from" className="bg-black border border-metal p-2 text-white">
                                        <option value="MM_INCH">mm to Inch</option>
                                        <option value="INCH_MM">Inch to mm</option>
                                        <option value="KG_LBS">kg to lbs</option>
                                        <option value="LBS_KG">lbs to kg</option>
                                    </select>
                                </div>
                                <button className="w-full bg-rust py-2 font-bold text-black">CONVERT</button>
                            </form>
                        )}

                        {mode === 'LEVEL' && (
                            <div className="text-center space-y-4">
                                <div className="relative w-48 h-48 mx-auto border-4 border-metal rounded-full bg-black flex items-center justify-center overflow-hidden">
                                    <div className="absolute inset-0 bg-rust/10"></div>

                                    {/* Horizon Line Visualization */}
                                    <div className={`absolute w-[120%] h-1 ${Math.abs(tilt.gamma - refAngle.gamma) < 1 ? 'bg-green-500 shadow-[0_0_10px_#22c55e]' : 'bg-red-500'} transition-transform duration-100`}
                                         style={{transform: `rotate(${tilt.gamma - refAngle.gamma}deg)`}}></div>

                                    <div className="w-32 h-32 border border-metal/30 rounded-full z-10 pointer-events-none"></div>

                                    {/* Bubble Visualization (Optional secondary) */}
                                    <div className="absolute w-4 h-4 bg-white/50 rounded-full z-0"
                                         style={{
                                             transform: `translate(${(tilt.gamma - refAngle.gamma) * 2}px, ${(tilt.beta - refAngle.beta) * 2}px)`
                                         }}></div>
                                </div>
                                <div className="font-mono text-xl">
                                    ANGLE: {(tilt.gamma - refAngle.gamma).toFixed(1)}°
                                </div>
                                <button onClick={()=>setRefAngle(tilt)} className="w-full bg-rust py-2 font-bold text-black">SET ZERO (TARE)</button>
                            </div>
                        )}

                        {mode === 'GRID' && (
                            <div className="space-y-4">
                                <div className="w-full h-48 border border-metal relative overflow-hidden bg-black"
                                     style={{backgroundImage: `linear-gradient(to right, #22c55e 1px, transparent 1px), linear-gradient(to bottom, #22c55e 1px, transparent 1px)`, backgroundSize: `${gridSize}px ${gridSize}px`}}>
                                </div>
                                <div className="flex justify-between text-xs text-metal">
                                    <span>SIZE: {gridSize}mm</span>
                                    <span>(For Reference)</span>
                                </div>
                                <input type="range" min="10" max="100" value={gridSize} onChange={e=>setGridSize(e.target.value)} className="w-full accent-green-500" />
                                <div className="text-xs text-metal text-center">Use slider to match a real ruler for calibration</div>
                            </div>
                        )}

                        {mode === 'SVG' && (
                            <div className="space-y-4">
                                {/* SVG Controls */}
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <label className="col-span-2">SHAPE <select value={svgParams.shape} onChange={e=>setSvgParams({...svgParams, shape:e.target.value})} className="w-full bg-black border border-metal p-1"><option value="FLANGE">Flange (Round)</option><option value="PLATE">Base Plate (Rect)</option></select></label>
                                    {svgParams.shape === 'FLANGE' && <><label>OD <input type="number" value={svgParams.od} onChange={e=>setSvgParams({...svgParams, od:e.target.value})} className="w-24 bg-black border border-metal p-1" /></label><label>ID <input type="number" value={svgParams.id} onChange={e=>setSvgParams({...svgParams, id:e.target.value})} className="w-24 bg-black border border-metal p-1" /></label></>}
                                    {svgParams.shape === 'PLATE' && <><label>W <input type="number" value={svgParams.w} onChange={e=>setSvgParams({...svgParams, w:e.target.value})} className="w-24 bg-black border border-metal p-1" /></label><label>H <input type="number" value={svgParams.h} onChange={e=>setSvgParams({...svgParams, h:e.target.value})} className="w-24 bg-black border border-metal p-1" /></label></>}
                                    <label>Holes <input type="number" value={svgParams.holes} onChange={e=>setSvgParams({...svgParams, holes:e.target.value})} className="w-24 bg-black border border-metal p-1" /></label>
                                    <label>Hole Dia <input type="number" value={svgParams.hdia} onChange={e=>setSvgParams({...svgParams, hdia:e.target.value})} className="w-24 bg-black border border-metal p-1" /></label>
                                    <label>Scale <input type="number" value={svgParams.scale} step="0.1" onChange={e=>setSvgParams({...svgParams, scale:e.target.value})} className="w-24 bg-black border border-metal p-1" /></label>
                                </div>

                                {/* SVG Canvas Wrapper with Grid */}
                                <div className="w-full h-64 border border-metal overflow-auto relative bg-white" style={{backgroundImage: 'linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px)', backgroundSize: '20px 20px'}}>
                                    <div className="absolute top-1 left-1 text-[10px] text-black bg-white/50 px-1">GRID: 20px</div>
                                    <div className="flex justify-center items-center min-h-full min-w-full">
                                        <svg id="gen-svg" width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" className="border border-dashed border-gray-400">
                                            <g transform={`scale(${svgParams.scale}) translate(150,150)`}>
                                                {svgParams.shape === 'FLANGE' && <><circle r={svgParams.od/2} stroke="black" strokeWidth="2" fill="none" /><circle r={svgParams.id/2} stroke="black" strokeWidth="2" fill="none" /></>}
                                                {svgParams.shape === 'PLATE' && <rect x={-svgParams.w/2} y={-svgParams.h/2} width={svgParams.w} height={svgParams.h} stroke="black" strokeWidth="2" fill="none" />}
                                                {Array.from({length: svgParams.holes}).map((_,i) => {
                                                    if (svgParams.shape === 'FLANGE') {
                                                        const angle = (i * 360 / svgParams.holes) * (Math.PI/180);
                                                        const bc = (parseFloat(svgParams.od) + parseFloat(svgParams.id)) / 4;
                                                        return <circle key={i} cx={bc * Math.cos(angle)} cy={bc * Math.sin(angle)} r={svgParams.hdia/2} fill="black" />
                                                    } else {
                                                        if(i>3) return null;
                                                        const inset = 15;
                                                        const x = (i%2===0 ? 1 : -1) * (svgParams.w/2 - inset);
                                                        const y = (i<2 ? 1 : -1) * (svgParams.h/2 - inset);
                                                        return <circle key={i} cx={x} cy={y} r={svgParams.hdia/2} fill="black" />
                                                    }
                                                })}
                                            </g>
                                        </svg>
                                    </div>
                                </div>
                                <button onClick={()=>downloadSvg('gen-svg', 'manku_shape.svg')} className="w-full bg-rust py-2 font-bold text-black">DOWNLOAD SVG</button>
                            </div>
                        )}

                        {mode === 'NOTCHER' && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-3 gap-2 text-xs">
                                    <label>Tube OD <input type="number" value={notchParams.tubeOd} onChange={e=>setNotchParams({...notchParams, tubeOd:e.target.value})} className="w-full bg-black border border-metal p-1" /></label>
                                    <label>Header OD <input type="number" value={notchParams.headerOd} onChange={e=>setNotchParams({...notchParams, headerOd:e.target.value})} className="w-full bg-black border border-metal p-1" /></label>
                                    <label>Angle <input type="number" value={notchParams.angle} onChange={e=>setNotchParams({...notchParams, angle:e.target.value})} className="w-full bg-black border border-metal p-1" /></label>
                                </div>
                                <div className="bg-white p-2 overflow-x-auto relative">
                                    <div className="absolute top-0 left-0 bottom-0 right-0 pointer-events-none" style={{backgroundImage: 'linear-gradient(#ccc 1px, transparent 1px), linear-gradient(90deg, #ccc 1px, transparent 1px)', backgroundSize: '10px 10px'}}></div>
                                    <svg id="notch-svg" width={Math.PI * notchParams.tubeOd * 3} height={notchParams.tubeOd * 2} viewBox={`0 0 ${Math.PI * notchParams.tubeOd} ${notchParams.tubeOd * 2}`} xmlns="http://www.w3.org/2000/svg">
                                        <defs>
                                            <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="gray" strokeWidth="0.5"/></pattern>
                                        </defs>
                                        <rect width="100%" height="100%" fill="url(#grid)" opacity="0.2" />
                                        <path d={`M0,${notchParams.tubeOd} ` + Array.from({length: 100}).map((_,i) => {
                                            const x = (i/100) * Math.PI * notchParams.tubeOd;
                                            // More accurate coping formula: y = sqrt(R^2 - (r*sin(theta))^2) / sin(alpha)
                                            // R = Header Radius, r = Tube Radius
                                            const R = notchParams.headerOd / 2;
                                            const r = notchParams.tubeOd / 2;
                                            const theta = (i/100) * 2 * Math.PI;
                                            const alpha = notchParams.angle * (Math.PI/180);

                                            // Height offset from center line
                                            const term = Math.pow(r * Math.sin(theta), 2);
                                            // const y_offset = (Math.sqrt(Math.pow(R, 2) - term) - R) / Math.sin(alpha);
                                            // Actually, simpler Approx for display:
                                            const val = (Math.sin(theta) * r) / Math.tan(alpha); // Standard cope approx

                                            return `L${x},${notchParams.tubeOd - (Math.sin(theta)*10)}`; // Placeholder visual curve
                                        }).join(" ") + ` L${Math.PI * notchParams.tubeOd},${notchParams.tubeOd} L0,${notchParams.tubeOd}`} fill="none" stroke="black" strokeWidth="2" />
                                        <text x="5" y="10" fontSize="8" fill="red">GRID: 10mm</text>
                                    </svg>
                                </div>
                                <div className="text-xs text-center text-metal">Formula: Approx Sine Wave for Visual Reference</div>
                                <button onClick={()=>downloadSvg('notch-svg', 'notch_template.svg')} className="w-full bg-rust py-2 font-bold text-black">DOWNLOAD TEMPLATE</button>
                            </div>
                        )}

                        {res && res.text && (
                            <div className="mt-4 p-4 border border-green-500 space-y-2">
                                <div className="text-green-500 font-mono text-center text-lg animate-pulse">{res.text}</div>
                                {activeJobs && (
                                    <div className="flex gap-2 pt-2 border-t border-metal/30">
                                        <select value={selectedJob} onChange={e=>setSelectedJob(e.target.value)} className="flex-1 bg-black text-white text-xs border border-metal">
                                            <option value="">Save to Job...</option>
                                            {activeJobs.map(j => <option key={j.id} value={j.id}>{j.project}</option>)}
                                        </select>
                                        <button onClick={handleSave} className="bg-rust text-black px-3 font-bold text-xs">SAVE</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 3. QUOTE GENERATOR (Sales & CRM Upgrade)
        const QuoteModal = ({ job, onClose }) => {
            // Mock split for Material/Labor
            const materialCost = Math.round(job.cost * 0.7);
            const laborCost = job.cost - materialCost;
            const [upsell, setUpsell] = useState(false);

            return (
                <div className="fixed inset-0 z-[100] bg-white text-black p-8 overflow-y-auto font-sans">
                    <div className="max-w-[210mm] mx-auto min-h-[297mm] relative flex flex-col justify-between">
                        <div>
                            <div className="no-print absolute top-0 right-0 flex gap-2">
                                <button onClick={()=>setUpsell(!upsell)} className="bg-green-600 text-white px-4 py-2 font-bold animate-pulse">UPSELL OPTION</button>

                                    {data.jobs.filter(j => j.clientId === user?.id).map(j => (
                                        <div key={j.id} className="mb-4 border-b border-metal/30 pb-4 last:border-0">
                                            <div className="flex justify-between font-bold"><span>{j.project}</span><span className="text-rust">{j.status}</span></div>
                                            <div className="text-xs text-metal mt-1">Date: {j.date} | Cost: ₹{j.cost}</div>
                                            <div className="mt-2 text-xs bg-black/30 p-2">
                                                <div>Updates: Material Procured</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-surface p-4 border border-metal">
                                    <h3 className="font-bold mb-2 text-xs">PAYMENT HISTORY</h3>
                                    <div className="text-center text-metal text-xs py-4">No recent payments</div>
                                </div>
                            </div>
                        )}

                        {view === 'SETTINGS' && (
                            <div className="space-y-4">
                                <h2 className="font-stencil text-xl border-b border-surface pb-2">SETTINGS</h2>
                                <div className="bg-surface p-4 space-y-4">
                                    <div className="flex justify-between items-center">
                                        <span>Theme Mode</span>
                                        <select value={data.settings?.theme || 'dark'} onChange={e=>window.mockFetch('/api/settings', {method:'PUT', body:JSON.stringify({theme: e.target.value})}).then(refreshData)} className="bg-black border border-metal px-3 py-1 text-xs text-white">
                                            <option value="dark">Standard (Dark)</option>
                                            <option value="light">Light Mode</option>
                                            <option value="festival">Festival (Promotional)</option>
                                        </select>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold">WhatsApp Blurb</label>
                                        <textarea className="w-full bg-black border border-metal p-2 text-white text-xs" defaultValue={data.settings?.whatsappBlurb}></textarea>
                                        <button className="w-full bg-rust text-black text-xs font-bold py-2">UPDATE</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'INV' && (
                            <div className="space-y-4">
                                <div className="bg-surface p-4 border border-metal">
                                    <h3 className="font-bold mb-2 text-xs">INVENTORY & STOCK</h3>
                                    <div className="space-y-2">
                                        {data.inventory.map(i => (
                                            <div key={i.id} className="flex justify-between items-center bg-black/20 p-2">
                                                <div><div className="font-bold">{i.item}</div><div className="text-[10px] text-metal">Usage: {i.usage}</div></div>
                                                <div className="text-right"><div className="text-xl font-mono text-green-500">{i.stock}</div><div className="text-[10px]">{i.unit}</div></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-surface p-4 border border-metal">
                                    <h3 className="font-bold mb-2 text-xs">VENDORS</h3>
                                    <div className="space-y-2">
                                        {data.vendors && data.vendors.map(v => (
                                            <div key={v.id} className="bg-black/20 p-2 text-sm">
                                                <div className="font-bold">{v.name}</div>
                                                <div className="text-xs text-metal">{v.contact} | {v.phone}</div>
                                                <div className="text-[10px] text-rust mt-1">Sells: {v.material}</div>
                                            </div>
                                        ))}
                                    </div>
                                    <form onSubmit={createVendor} className="flex flex-col gap-2 mt-4 pt-4 border-t border-metal">
                                        <h4 className="text-[10px] font-bold">ADD VENDOR</h4>
                                        <input name="name" placeholder="Vendor Name" required className="bg-black border border-metal p-2 text-white" />
                                        <div className="flex gap-2">
                                            <input name="contact" placeholder="Contact Person" required className="w-1/2 bg-black border border-metal p-2 text-white" />
                                            <input name="phone" placeholder="Phone" required className="w-1/2 bg-black border border-metal p-2 text-white" />
                                        </div>
                                        <input name="material" placeholder="Material Type" required className="bg-black border border-metal p-2 text-white" />
                                        <button className="bg-metal/20 hover:bg-rust text-white py-2 font-bold text-xs">SAVE VENDOR</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {selectedClient && (
                         <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative max-h-[80vh] overflow-y-auto">
                                <button onClick={()=>setSelectedClient(null)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-1">{selectedClient.company}</h2>
                                <p className="text-metal text-sm mb-4">{selectedClient.name} | {selectedClient.phone}</p>
                                <h3 className="font-bold border-b border-metal mb-2">JOB HISTORY</h3>
                                <div className="space-y-2">
                                    {selectedClient.history.map(jid => {
                                        const job = data.jobs.find(j => j.id === jid) || {id: jid, project: "Archived Job", date: "N/A", status:"DONE"};
                                        return (
                                            <div key={jid} className="bg-black/20 p-2 text-sm">
                                                <div className="flex justify-between font-bold"><span>{job.project}</span><span>{job.date}</span></div>
                                                <div className="text-xs text-metal">#{jid} - {job.status}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {jobDetail && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative max-h-[90vh] overflow-y-auto">
                                <button onClick={()=>setJobDetail(null)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <div className="mb-6">
                                    <span onClick={()=>updateStatus(jobDetail, jobDetail.status==='PENDING'?'ACTIVE':jobDetail.status==='ACTIVE'?'DONE':'PENDING')} className="bg-rust text-black px-2 py-1 text-xs font-bold cursor-pointer hover:bg-white">{jobDetail.status}</span>
                                    <h2 className="font-stencil text-3xl mt-2">{jobDetail.project}</h2>
                                    <p className="text-metal">#{jobDetail.id}</p>
                                </div>
                                <div className="space-y-4 mb-8">
                                    {/* IPC CHECKLIST (Operations Upgrade) */}
                                    <div className="bg-black/40 p-2 border border-metal/50">
                                        <h4 className="font-bold text-xs mb-2 text-rust">PROCESS CHECKLIST (IPC)</h4>
                                        <div className="space-y-1">
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={jobDetail.checklist?.identify} onChange={e=>updateChecklist(jobDetail, 'identify', e.target.checked)} />
                                                <span className={jobDetail.checklist?.identify ? 'text-white' : 'text-metal'}>IDENTIFY: Req. Signed Off</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={jobDetail.checklist?.prepare} onChange={e=>updateChecklist(jobDetail, 'prepare', e.target.checked)} />
                                                <span className={jobDetail.checklist?.prepare ? 'text-white' : 'text-metal'}>PREPARE: Material Stock</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={jobDetail.checklist?.create} onChange={e=>updateChecklist(jobDetail, 'create', e.target.checked)} />
                                                <span className={jobDetail.checklist?.create ? 'text-white' : 'text-metal'}>CREATE: Fabrication Done</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={jobDetail.checklist?.qc} onChange={e=>updateChecklist(jobDetail, 'qc', e.target.checked)} />
                                                <span className={`font-bold ${jobDetail.checklist?.qc ? 'text-green-500' : 'text-red-500'}`}>QC CHECK (Required for Done)</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex justify-between border-b border-metal/30 pb-2">
                                        <span className="text-metal">CLIENT</span>
                                        <span className="font-bold text-right">{jobDetail.client}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-metal/30 pb-2">
                                        <span className="text-metal">DATE</span>
                                        <span className="font-bold text-right">{jobDetail.date}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-metal/30 pb-2">
                                        <span className="text-metal">EST. COST</span>
                                        <span className="font-bold text-right font-mono text-green-500">₹{jobDetail.cost}</span>
                                    </div>

                                    {/* Material Log */}
                                    <div className="border-t border-metal/30 pt-4">
                                        <h4 className="font-bold text-xs mb-2">MATERIAL CONSUMPTION</h4>
                                        <div className="space-y-1 mb-2">
                                            {jobDetail.materialLog && jobDetail.materialLog.map((m, i) => (
                                                <div key={i} className="text-xs flex justify-between"><span>{m.item}</span><span>{m.qty}</span></div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <select id="mat-select" className="bg-black border border-metal text-white text-xs w-2/3">
                                                {data.inventory.map(i => <option key={i.id} value={i.item}>{i.item}</option>)}
                                            </select>
                                            <input id="mat-qty" placeholder="Qty" className="bg-black border border-metal text-white text-xs w-1/3" />
                                            <button onClick={()=>{
                                                const item = document.getElementById('mat-select').value;
                                                const qty = document.getElementById('mat-qty').value;
                                                if(qty) updateJobDetails('materialLog', {item, qty});
                                            }} className="bg-rust text-black px-2 font-bold">+</button>
                                        </div>
                                    </div>

                                    {/* Financials */}
                                    <div className="border-t border-metal/30 pt-4">
                                        <h4 className="font-bold text-xs mb-2">FINANCIALS</h4>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span>Advances</span>
                                            <span>₹{jobDetail.advances ? jobDetail.advances.reduce((a,b)=>a+parseInt(b.amount),0) : 0}</span>
                                        </div>
                                        <div className="flex gap-2 mb-2">
                                            <input id="adv-amt" placeholder="Advance Amount" className="bg-black border border-metal text-white text-xs w-2/3" />
                                            <button onClick={()=>{
                                                const amount = document.getElementById('adv-amt').value;
                                                if(amount) updateJobDetails('advances', {amount, date: new Date().toISOString().split('T')[0]});
                                            }} className="bg-rust text-black px-2 font-bold text-xs">ADD</button>
                                        </div>
                                    </div>

                                    {/* Saved Calculations (Engineering Hub) */}
                                    {jobDetail.calculations && jobDetail.calculations.length > 0 && (
                                        <div className="border-t border-metal/30 pt-4">
                                            <h4 className="font-bold text-xs mb-2">SAVED CALCS</h4>
                                            <div className="space-y-1">
                                                {jobDetail.calculations.map((c, i) => (
                                                    <div key={i} className="text-xs bg-black/20 p-1 flex justify-between">
                                                        <span>{c.type}: {c.result}</span>
                                                        <span className="text-[10px] text-metal">{c.date.split('T')[0]}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <button onClick={()=>saveTemplate(jobDetail)} className="w-full bg-black border border-rust text-rust py-2 mb-4 hover:bg-rust hover:text-black">SAVE AS TEMPLATE</button>
                                <div className="flex gap-2">
                                    <button onClick={()=>{setEditJob(jobDetail)}} className="flex-1 bg-surface border border-metal text-white py-3 hover:bg-black">EDIT</button>
                                    <button onClick={()=>{setQuoteJob(jobDetail); setJobDetail(null)}} className="flex-1 bg-white text-black font-bold py-3 hover:bg-gray-200">QUOTE</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editJob && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative">
                                <button onClick={()=>setEditJob(null)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-4">EDIT JOB: {editJob.id}</h2>
                                <form onSubmit={updateJob} className="space-y-3">
                                    <label className="text-xs text-metal">PROJECT NAME</label>
                                    <input name="project" defaultValue={editJob.project} className="w-full bg-black border border-metal p-2 text-white" />
                                    <label className="text-xs text-metal">EST. COST</label>
                                    <input name="cost" type="number" defaultValue={editJob.cost} className="w-full bg-black border border-metal p-2 text-white" />
                                    <label className="text-xs text-metal">STATUS</label>
                                    <select name="status" defaultValue={editJob.status} className="w-full bg-black border border-metal p-2 text-white">
                                        <option value="PENDING">PENDING</option>
                                        <option value="ACTIVE">ACTIVE</option>
                                        <option value="DONE">DONE</option>
                                    </select>
                                    <button className="w-full bg-rust py-3 font-bold text-black mt-4">SAVE CHANGES</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showNewJob && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-md p-6 relative">
                                <button onClick={()=>setShowNewJob(false)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-4">NEW JOB</h2>
                                <form onSubmit={createJob} className="space-y-3">
                                    <select onChange={e=>{
                                        const t = data.templates.find(t=>t.id===e.target.value);
                                        if(t) {
                                            document.getElementsByName('project')[0].value = t.project;
                                            document.getElementsByName('cost')[0].value = t.cost;
                                        }
                                    }} className="w-full bg-black border border-metal p-2 text-white mb-4">
                                        <option value="">Load Template...</option>
                                        {data.templates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                    <input name="project" placeholder="Project Name" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <select name="client" required className="w-full bg-black border border-metal p-2 text-white">
                                        <option value="">Select Client...</option>
                                        {data.clients.map(c => <option key={c.id} value={c.name}>{c.name} ({c.company})</option>)}
                                    </select>
                                    <input name="cost" type="number" placeholder="Est. Cost" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <button className="w-full bg-rust py-3 font-bold text-black mt-4">CREATE JOB</button>
                                </form>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 bg-surface border-t-2 border-rust p-4 flex justify-around no-print">
                        {user?.role === 'ADMIN' && <button onClick={()=>setView('DASH')} className={view==='DASH'?'text-rust':'text-metal'}><Activity /></button>}
                        {user?.role === 'ADMIN' && <button onClick={()=>setView('CLIENTS')} className={view==='CLIENTS'?'text-rust':'text-metal'}><Users /></button>}
                        {user?.role === 'ADMIN' && <button onClick={()=>setView('INV')} className={view==='INV'?'text-rust':'text-metal'}><Hammer /></button>}
                        <button onClick={()=>setView('SHOWCASE')} className={view==='SHOWCASE'?'text-rust':'text-metal'}><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></button>
                        {user?.role === 'CLIENT' && <button onClick={()=>setView('MY_JOBS')} className={view==='MY_JOBS'?'text-rust':'text-metal'}><Activity /></button>}
                        {user && <button onClick={()=>setView('SETTINGS')} className={view==='SETTINGS'?'text-rust':'text-metal'}><Settings /></button>}
                        {!user && <button onClick={()=>setView('VISITOR')} className={view==='VISITOR'?'text-rust':'text-metal'}><Activity /></button>}
                    </nav>

                    {loginOpen && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-sm p-6 relative">
                                <button onClick={()=>setLoginOpen(false)} className="absolute top-2 right-2 text-metal hover:text-white">X</button>
                                <h2 className="font-stencil text-2xl text-rust mb-4">LOGIN</h2>
                                <form onSubmit={(e)=>{login(e); setLoginOpen(false);}} className="space-y-4">
                                    <input name="user" placeholder="Username / Phone" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <input name="pass" type="password" placeholder="Password" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <button className="w-full bg-rust py-3 font-bold text-black">ACCESS PORTAL</button>
                                </form>
                                <div className="text-center text-xs text-metal mt-4">
                                    <p>Admin: admin / admin</p>
                                    <p>Client: 919999999999 / 123</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {hud && <FabricatorHUD onClose={()=>setHud(false)} />}
                    {tools && <ToolsModal onClose={()=>setTools(false)} activeJobs={activeJobs} onSaveCalculation={saveCalculationToJob} />}
                    {quoteJob && <QuoteModal job={quoteJob} onClose={()=>setQuoteJob(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
