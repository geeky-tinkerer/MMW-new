<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1c1917">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Manku Metal Works - SECURE OPS</title>

    <!-- LIBRARIES (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>window.react = window.React;</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@0.556.0/dist/umd/lucide-react.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Black+Ops+One&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <script>
        // THEME CONFIG
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { stencil: ["'Black Ops One'", 'cursive'], mono: ["'Courier Prime'", 'monospace'] },
                    colors: {
                        rust: 'var(--color-primary)',
                        oil: 'var(--color-bg)',
                        metal: 'var(--color-text-dim)',
                        surface: 'var(--color-surface)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: #c2410c; --color-bg: #1c1917; --color-surface: #292524; --color-text-main: #f5f5f4; --color-text-dim: #a8a29e;
            --bg-texture: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'%3E%3C/svg%3E");
        }
        /* Festival Theme Override */
        body.theme-festival { --color-primary: #fbbf24; --color-bg: #2e1065; --color-surface: #4c1d95; }

        body { background-color: var(--color-bg); background-image: var(--bg-texture); color: var(--color-text-main); font-family: 'Courier Prime', monospace; transition: background-color 0.5s, color 0.5s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- MOCK ADAPTER (Internal Logic for Demo) -->
    <script src="pwa_mock_adapter.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Camera, Calculator, Hammer, FileText, Ruler, Grid, Activity, Users, Settings, LogOut, Download, UploadCloud, AlertTriangle, Plus, Edit, X, ChevronLeft, ChevronRight, Save, Phone, Share2, Sun, Moon, StickyNote, Table, Circle, Dna, Search, User, Home, Calendar, MessageSquare, Image, Truck, Bell, CreditCard, Clock, FilePlus, CheckCircle, Send, Square, Minus, Type, Trash, PenTool, BookOpen, TrendingUp, TrendingDown, Smartphone, Loader2, Link } = LucideReact;

        // --- PACKAGE 1: NATIVE CORE UTILS ---
        const GAS_API_URL = "INSERT_DEPLOY_ID_HERE";
        const vibe = (ms=15) => { if(navigator.vibrate) navigator.vibrate(ms); };

        // Global Config Bridge
        window.NEXUS_CONFIG = { useRealBackend: false };

        // API SERVICE (External to React for broader scope)
        const api = {
            post: async (payload) => {
                // PACKAGE 4: PRODUCTION SWITCH
                if (window.NEXUS_CONFIG.useRealBackend && GAS_API_URL !== "INSERT_DEPLOY_ID_HERE") {
                    try {
                        const res = await fetch(GAS_API_URL, {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                         if (!res.ok) throw new Error(`Server Error: ${res.status}`);
                        return res.json();
                    } catch (e) {
                         throw e;
                    }
                } else {
                    const res = await window.mockFetch('/api/exec', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error(`Server Error: ${res.status}`);
                    return res.json();
                }
            },
            upload: (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024;
                        const scaleSize = MAX_WIDTH / img.width;

                        if (img.width > MAX_WIDTH) {
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                        } else {
                            canvas.width = img.width;
                            canvas.height = img.height;
                        }

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                        resolve(compressedBase64);

                        api.post({
                            action: "upload_image",
                            image: compressedBase64,
                            mimeType: "image/jpeg",
                            filename: file.name
                        }).then(() => {
                             if(window.showToast) window.showToast("Upload Synced!", "success");
                        }).catch(e => {
                             console.error("Background Upload Failed", e);
                             if(window.showToast) window.showToast("Sync Failed - Retrying...", "error");
                        });
                    };
                    img.onerror = (e) => reject(new Error("Image Load Failed"));
                };
                reader.onerror = (error) => reject(error);
            })
        };

        // 1. FABRICATOR HUD
        const FabricatorHUD = ({ onClose }) => {
            const [mode, setMode] = useState('VIEW');
            const [snapshot, setSnapshot] = useState(null);
            const [tilt, setTilt] = useState(0);
            const [gridSize, setGridSize] = useState(50);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const streamRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const handleOr = (e) => setTilt(e.gamma || 0);
                window.addEventListener('deviceorientation', handleOr);
                navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(s => { streamRef.current = s; if(videoRef.current) videoRef.current.srcObject = s; }).catch(e => console.log("Cam Error", e));
                return () => { window.removeEventListener('deviceorientation', handleOr); if(streamRef.current) streamRef.current.getTracks().forEach(track => track.stop()); };
            }, []);

            const takeSnapshot = () => {
                vibe();
                const video = videoRef.current;
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                const scale = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
                const x = (canvas.width / 2) - (video.videoWidth / 2) * scale;
                const y = (canvas.height / 2) - (video.videoHeight / 2) * scale;
                ctx.drawImage(video, x, y, video.videoWidth * scale, video.videoHeight * scale);
                ctx.save(); ctx.translate(canvas.width/2, canvas.height/2); ctx.rotate(tilt * Math.PI / 180); ctx.fillStyle = '#22c55e'; ctx.fillRect(-canvas.width, 0, canvas.width*2, 2); ctx.restore();
                if (canvasRef.current) ctx.drawImage(canvasRef.current, 0, 0);
                setSnapshot(canvas.toDataURL('image/jpeg'));
            };

            const startDraw = (e) => {
                if (mode !== 'MARK') return;
                setIsDrawing(true);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                const { clientX, clientY } = e.touches ? e.touches[0] : e;
                ctx.moveTo(clientX, clientY);
                ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
            };
            const draw = (e) => {
                if (!isDrawing || mode !== 'MARK') return;
                const ctx = canvasRef.current.getContext('2d');
                const { clientX, clientY } = e.touches ? e.touches[0] : e;
                ctx.lineTo(clientX, clientY); ctx.stroke();
            };
            const endDraw = () => setIsDrawing(false);

            return (
                <div className="fixed inset-0 z-[200] bg-black text-white">
                    {snapshot ? (
                        <div className="relative w-full h-full flex flex-col">
                            <img src={snapshot} className="flex-1 object-contain bg-black" />
                            <div className="flex justify-around p-6 bg-black/90">
                                <button onClick={()=>{vibe(); setSnapshot(null)}} className="text-white font-bold">DISCARD</button>
                                <button onClick={()=>{vibe(); const a = document.createElement('a'); a.href = snapshot; a.download = 'ar_snap.jpg'; a.click(); onClose();}} className="text-rust font-bold">SAVE & CLOSE</button>
                            </div>
                        </div>
                    ) : (
                        <>
                            <video ref={videoRef} autoPlay playsInline className="absolute inset-0 w-full h-full object-cover opacity-70" />
                            <div className="absolute inset-0 z-0 pointer-events-none opacity-50" style={{backgroundImage: `linear-gradient(to right, rgba(34, 197, 94, 0.5) 1px, transparent 1px), linear-gradient(to bottom, rgba(34, 197, 94, 0.5) 1px, transparent 1px)`, backgroundSize: `${gridSize}px ${gridSize}px`}}></div>
                            <canvas ref={canvasRef} width={window.innerWidth} height={window.innerHeight} className={`absolute inset-0 z-10 ${mode==='MARK'?'pointer-events-auto':'pointer-events-none'}`} onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw} />
                            <div className={`absolute left-0 right-0 h-0.5 bg-green-500 shadow-[0_0_10px_#22c55e] transition-transform duration-100 z-0 top-1/2 pointer-events-none`} style={{transform: `rotate(${tilt}deg)`}}></div>
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 border border-green-500 rounded-full z-0 pointer-events-none"></div>
                            <div className="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black to-transparent z-20 flex flex-col gap-6">
                                <div className="flex items-center gap-2 px-4"><Grid size={16} className="text-green-500" /><input type="range" min="20" max="200" value={gridSize} onChange={e=>setGridSize(e.target.value)} className="w-full accent-green-500 h-1" /></div>
                                <div className="flex justify-center items-center gap-4 text-[10px] font-mono text-green-500"><div className="bg-black/50 px-2 py-1 rounded">TILT: {Math.round(tilt)}°</div><div className="bg-black/50 px-2 py-1 rounded">{mode === 'MARK' ? 'DRAW MODE' : 'VIEW MODE'}</div></div>
                                <div className="flex justify-between items-end">
                                    <button onClick={()=>{vibe(); onClose();}} className="bg-black/50 text-white p-3 rounded-full hover:bg-red-600 transition-colors z-[9999]"><X size={24}/></button>
                                    <div className="flex gap-4">
                                        <button onClick={()=>{vibe(); setMode(mode==='VIEW'?'MARK':'VIEW')}} className={`p-4 rounded-full transition-all ${mode==='MARK'?'bg-rust text-black scale-110 shadow-lg shadow-rust/50':'bg-black/50 text-white border border-white/30'}`}><Edit size={24} /></button>
                                        <button onClick={takeSnapshot} className="bg-white text-black p-4 rounded-full border-4 border-gray-300 shadow-xl active:scale-95 transition-transform"><Camera size={28} /></button>
                                    </div>
                                    <div className="w-12"></div>
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        // 1.5 CAD DESIGNER
        const CadDesigner = ({ job, onClose, onSave, activeJobs }) => {
            const [shapes, setShapes] = useState((job && job.design) ? job.design : []);
            const [selected, setSelected] = useState(null);
            const [tool, setTool] = useState('SELECT');
            const [selectedJobId, setSelectedJobId] = useState(job ? job.id : "");
            const [dragStart, setDragStart] = useState(null);
            const [isDragging, setIsDragging] = useState(false);
            const [gridSize, setGridSize] = useState(20);
            const [showProp, setShowProp] = useState(false);
            const svgRef = useRef(null);

            const getCoords = (e) => {
                const rect = svgRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: Math.round((clientX - rect.left) / gridSize) * gridSize, y: Math.round((clientY - rect.top) / gridSize) * gridSize };
            };

            const addShape = (type, x, y) => {
                const id = Date.now().toString();
                const newShape = { id, type, x, y, color: '#FFFFFF', rotation: 0 };
                if(type === 'RECT') { newShape.w = gridSize*4; newShape.h = gridSize*4; }
                if(type === 'CIRCLE') { newShape.r = gridSize*2; }
                if(type === 'LINE') { newShape.x2 = x + gridSize*4; newShape.y2 = y; }
                if(type === 'TEXT') { newShape.text = "TEXT"; newShape.size = 16; }
                setShapes([...shapes, newShape]); setSelected(id); setTool('SELECT');
            };

            const handlePointerDown = (e, shapeId = null) => {
                if(tool !== 'SELECT' && !shapeId) { const {x,y} = getCoords(e); addShape(tool, x, y); return; }
                if(shapeId) { e.stopPropagation(); setSelected(shapeId); setDragStart(getCoords(e)); setIsDragging(true); setShowProp(true); } else { setSelected(null); setShowProp(false); }
            };

            const handlePointerMove = (e) => {
                if(!isDragging || !selected) return;
                const curr = getCoords(e);
                const dx = curr.x - dragStart.x;
                const dy = curr.y - dragStart.y;
                if(dx === 0 && dy === 0) return;
                setShapes(shapes.map(s => {
                    if(s.id !== selected) return s;
                    const ns = {...s};
                    if(s.type === 'LINE') { ns.x += dx; ns.y += dy; ns.x2 += dx; ns.y2 += dy; } else { ns.x += dx; ns.y += dy; }
                    return ns;
                }));
                setDragStart(curr);
            };

            const handlePointerUp = () => setIsDragging(false);
            const updateShape = (prop, val) => setShapes(shapes.map(s => s.id === selected ? {...s, [prop]: val} : s));
            const deleteShape = () => { setShapes(shapes.filter(s => s.id !== selected)); setSelected(null); };

            const exportPdf = () => {
                vibe();
                if(!window.jspdf) return alert("PDF Lib not loaded");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFillColor(0, 51, 102); doc.rect(0, 0, 210, 297, 'F');
                doc.setTextColor(255, 255, 255); doc.setFont("courier", "bold"); doc.setFontSize(24);
                doc.text("MANKU METAL WORKS", 10, 20); doc.setFontSize(12);
                doc.text(job ? `PROJECT: ${job.project}` : "CONCEPT DESIGN", 10, 30); doc.text(`DATE: ${new Date().toLocaleDateString()}`, 10, 36);
                doc.setLineDashPattern([], 0); doc.setLineWidth(0.5);
                shapes.forEach(s => {
                    doc.setDrawColor(255, 255, 255);
                    if(s.type === 'RECT') doc.rect(s.x/4, s.y/4 + 50, s.w/4, s.h/4);
                    if(s.type === 'CIRCLE') doc.circle(s.x/4, s.y/4 + 50, s.r/4);
                    if(s.type === 'LINE') doc.line(s.x/4, s.y/4 + 50, s.x2/4, s.y2/4 + 50);
                    if(s.type === 'TEXT') { doc.setFontSize(s.size/2); doc.text(s.text, s.x/4, s.y/4 + 50); }
                });
                doc.save("manku_design.pdf");
            };

            const selShape = shapes.find(s => s.id === selected);

            return (
                <div className="fixed inset-0 z-[200] bg-[#003366] text-white flex flex-col font-mono overflow-hidden">
                    <div className="flex justify-between items-center p-2 border-b border-white/20 bg-[#002244]">
                        <div className="flex gap-2">
                             <button onClick={()=>{vibe(); onClose()}} className="p-2 hover:bg-white/10 rounded z-[9999]"><ChevronLeft /></button>
                             <div className="flex flex-col"><span className="font-bold text-sm">CAD DESIGNER</span>{job ? (<span className="text-[10px] text-gray-400">{job.project}</span>) : (activeJobs && (<select className="text-[10px] bg-black border border-white/20 text-white rounded" value={selectedJobId} onChange={e=>setSelectedJobId(e.target.value)}><option value="">Save as Template</option>{activeJobs.map(j => <option key={j.id} value={j.id}>{j.project}</option>)}</select>))}</div>
                        </div>
                        <div className="flex gap-2">
                             <button onClick={()=>setTool('SELECT')} className={`p-2 rounded ${tool==='SELECT'?'bg-rust text-black':'hover:bg-white/10'}`}><Edit size={18}/></button>
                             <button onClick={()=>setTool('RECT')} className={`p-2 rounded ${tool==='RECT'?'bg-rust text-black':'hover:bg-white/10'}`}><Square size={18}/></button>
                             <button onClick={()=>setTool('CIRCLE')} className={`p-2 rounded ${tool==='CIRCLE'?'bg-rust text-black':'hover:bg-white/10'}`}><Circle size={18}/></button>
                             <button onClick={()=>setTool('LINE')} className={`p-2 rounded ${tool==='LINE'?'bg-rust text-black':'hover:bg-white/10'}`}><Minus size={18}/></button>
                             <button onClick={()=>setTool('TEXT')} className={`p-2 rounded ${tool==='TEXT'?'bg-rust text-black':'hover:bg-white/10'}`}><Type size={18}/></button>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={exportPdf} className="p-2 hover:bg-white/10 rounded"><Download size={18}/></button>
                            <button onClick={()=>{vibe(); onSave(shapes, selectedJobId)}} className="p-2 hover:bg-white/10 rounded"><Save size={18}/></button>
                        </div>
                    </div>
                    <div className="flex-1 relative overflow-hidden touch-none" onPointerMove={handlePointerMove} onPointerUp={handlePointerUp}>
                        <div className="absolute inset-0 pointer-events-none" style={{backgroundImage: `linear-gradient(to right, rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.1) 1px, transparent 1px)`, backgroundSize: `${gridSize}px ${gridSize}px`}}></div>
                        <svg ref={svgRef} className="w-full h-full" onPointerDown={(e)=>handlePointerDown(e)}>
                            {shapes.map(s => {
                                const isSel = s.id === selected;
                                const stroke = isSel ? "#c2410c" : "white";
                                const width = isSel ? 3 : 2;
                                if(s.type === 'RECT') return <rect key={s.id} x={s.x} y={s.y} width={s.w} height={s.h} fill="none" stroke={stroke} strokeWidth={width} onPointerDown={(e)=>handlePointerDown(e, s.id)} />
                                if(s.type === 'CIRCLE') return <circle key={s.id} cx={s.x} cy={s.y} r={s.r} fill="none" stroke={stroke} strokeWidth={width} onPointerDown={(e)=>handlePointerDown(e, s.id)} />
                                if(s.type === 'LINE') return <line key={s.id} x1={s.x} y1={s.y} x2={s.x2} y2={s.y2} stroke={stroke} strokeWidth={width} onPointerDown={(e)=>handlePointerDown(e, s.id)} />
                                if(s.type === 'TEXT') return <text key={s.id} x={s.x} y={s.y} fill={stroke} fontSize={s.size} fontFamily="monospace" onPointerDown={(e)=>handlePointerDown(e, s.id)}>{s.text}</text>
                                return null;
                            })}
                        </svg>
                        {selShape && (
                            <div className="absolute bottom-4 left-4 right-4 bg-black/80 p-4 border border-white/20 rounded backdrop-blur text-xs flex flex-wrap gap-4 items-end animate-fade-in">
                                {selShape.type === 'RECT' && (<><label>W: <input type="number" value={selShape.w} onChange={e=>updateShape('w', parseInt(e.target.value))} className="w-16 bg-transparent border-b border-white text-center"/></label><label>H: <input type="number" value={selShape.h} onChange={e=>updateShape('h', parseInt(e.target.value))} className="w-16 bg-transparent border-b border-white text-center"/></label></>)}
                                {selShape.type === 'CIRCLE' && (<label>R: <input type="number" value={selShape.r} onChange={e=>updateShape('r', parseInt(e.target.value))} className="w-16 bg-transparent border-b border-white text-center"/></label>)}
                                {selShape.type === 'TEXT' && (<><label>TEXT: <input type="text" value={selShape.text} onChange={e=>updateShape('text', e.target.value)} className="w-32 bg-transparent border-b border-white"/></label><label>SIZE: <input type="number" value={selShape.size} onChange={e=>updateShape('size', parseInt(e.target.value))} className="w-12 bg-transparent border-b border-white text-center"/></label></>)}
                                <div className="flex-1"></div>
                                <button onClick={deleteShape} className="text-red-500 font-bold flex gap-1 items-center"><Trash size={14}/> DELETE</button>
                            </div>
                        )}
                        {!selShape && <div className="absolute bottom-4 left-4 text-[10px] text-gray-400">GRID: {gridSize}px | TOOL: {tool} | SHAPES: {shapes.length}</div>}
                    </div>
                </div>
            );
        };

        // 1.8 LEDGER VIEW
        const LedgerView = ({ data }) => {
            const [filter, setFilter] = useState('ALL');
            const transactions = [];
            (data.jobs || []).forEach(j => {
                if(j.advances) j.advances.forEach(a => transactions.push({ id: `ADV-${j.id}-${a.date}`, date: a.date, desc: `Advance: ${j.project}`, type: 'INCOME', amount: parseInt(a.amount), ref: j.id }));
                if(j.expenses) j.expenses.forEach(e => transactions.push({ id: `EXP-${j.id}-${e.date}`, date: e.date, desc: `Exp: ${e.desc} (${j.project})`, type: 'EXPENSE', amount: parseInt(e.amount), ref: j.id }));
            });
            const sorted = transactions.sort((a,b) => new Date(b.date) - new Date(a.date));
            const filtered = sorted.filter(t => filter === 'ALL' || t.type === filter);
            const balance = sorted.reduce((acc, t) => t.type === 'INCOME' ? acc + t.amount : acc - t.amount, 0);
            const totalIn = sorted.filter(t=>t.type==='INCOME').reduce((a,b)=>a+b.amount,0);
            const totalOut = sorted.filter(t=>t.type==='EXPENSE').reduce((a,b)=>a+b.amount,0);
            const maxVal = Math.max(totalIn, totalOut, 1);

            return (
                <div className="space-y-4 animate-fade-in">
                    <div className="bg-surface p-4 border border-metal/30">
                        <div className="flex justify-between items-end mb-4">
                            <div><div className="text-xs text-metal">NET BALANCE</div><div className={`text-2xl font-mono font-bold ${balance >= 0 ? 'text-green-500' : 'text-red-500'}`}>₹{balance.toLocaleString()}</div></div>
                            <div className="flex gap-2 text-xs">
                                <button onClick={()=>setFilter('ALL')} className={`px-2 py-1 border ${filter==='ALL'?'bg-rust text-black border-rust':'border-metal text-metal'}`}>ALL</button>
                                <button onClick={()=>setFilter('INCOME')} className={`px-2 py-1 border ${filter==='INCOME'?'bg-green-600 text-black border-green-600':'border-metal text-metal'}`}>IN</button>
                                <button onClick={()=>setFilter('EXPENSE')} className={`px-2 py-1 border ${filter==='EXPENSE'?'bg-red-600 text-black border-red-600':'border-metal text-metal'}`}>OUT</button>
                            </div>
                        </div>
                        <div className="flex h-20 items-end gap-4 text-[10px] font-mono border-b border-metal/30 pb-2">
                            <div className="flex-1 flex flex-col justify-end gap-1"><div className="text-green-500 text-center">₹{totalIn/1000}k</div><div className="bg-green-500/50 border border-green-500 w-full transition-all duration-500" style={{height: `${(totalIn/maxVal)*100}%`}}></div><div className="text-center text-metal">IN</div></div>
                            <div className="flex-1 flex flex-col justify-end gap-1"><div className="text-red-500 text-center">₹{totalOut/1000}k</div><div className="bg-red-500/50 border border-red-500 w-full transition-all duration-500" style={{height: `${(totalOut/maxVal)*100}%`}}></div><div className="text-center text-metal">OUT</div></div>
                        </div>
                    </div>
                    <div className="space-y-2">
                        {filtered.map(t => (
                            <div key={t.id} className="bg-surface border-l-4 border-metal/30 p-2 flex justify-between items-center text-xs relative overflow-hidden">
                                <div className={`absolute left-0 top-0 bottom-0 w-1 ${t.type==='INCOME'?'bg-green-500':'bg-red-500'}`}></div>
                                <div><div className="font-bold">{t.desc}</div><div className="text-metal">{t.date} | Ref: {t.ref}</div></div>
                                <div className={`font-mono font-bold ${t.type==='INCOME'?'text-green-500':'text-red-500'}`}>{t.type==='INCOME'?'+':'-'}₹{t.amount}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 2. TOOLS VIEW (RESTORED FULL)
        const ToolsView = ({ user }) => {
            const [mode, setMode] = useState('PIE');
            const [res, setRes] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [notes, setNotes] = useState(localStorage.getItem('mmw_notes') || '');
            const [tilt, setTilt] = useState({gamma:0, beta:0});
            const [refAngle, setRefAngle] = useState({gamma:0, beta:0});
            const [gridSize, setGridSize] = useState(50);
            const [svgParams, setSvgParams] = useState({shape:'FLANGE', w:100, h:100, od:100, id:50, holes:4, hdia:10, scale:1});
            const [notchParams, setNotchParams] = useState({tubeOd: 40, headerOd: 40, angle: 90});
            const [weightParams, setWeightParams] = useState({type:'PLATE', l:1000, w:1000, t:5, dia:50, wt:2});
            const [arcParams, setArcParams] = useState({c:100, h:10});

            useEffect(() => {
                if (mode !== 'LEVEL') return;
                const handleOr = (e) => setTilt({gamma: e.gamma||0, beta: e.beta||0});
                window.addEventListener('deviceorientation', handleOr);
                return () => window.removeEventListener('deviceorientation', handleOr);
            }, [mode]);

            const saveNotes = (val) => { setNotes(val); localStorage.setItem('mmw_notes', val); };
            const calcWeight = () => {
                const density = 0.00000785;
                let vol = 0;
                const {type, l, w, t, dia, wt} = weightParams;
                if(type === 'PLATE') vol = l * w * t;
                if(type === 'TUBE') vol = (Math.PI * (dia * wt - wt * wt)) * l;
                if(type === 'BAR') vol = (Math.PI * Math.pow(dia/2, 2)) * l;
                setRes({text: `${(vol * density).toFixed(2)} KG`, type: 'text'});
            };
            const calcArc = () => {
                const {c, h} = arcParams;
                if (h <= 0 || c <= 0) return;
                const r = (c*c)/(8*h) + h/2;
                const theta = 2 * Math.asin(c / (2*r));
                const arcLen = r * theta;
                setRes({text: `R: ${r.toFixed(1)} | Arc Len: ${arcLen.toFixed(1)}`, type: 'text'});
            };
            const calcPie = (e) => {
                e.preventDefault(); const d = new FormData(e.target);
                const angle = d.get('angle') / (d.get('seg') * 2);
                setRes({text: `CUT ANGLE: ${angle.toFixed(1)}°`, type: 'pie', angle, dia: d.get('dia')});
            };
            const calcTri = (e) => {
                e.preventDefault(); const d = new FormData(e.target);
                const a = parseFloat(d.get('a')); const b = parseFloat(d.get('b'));
                setRes({text: `HYPOTENUSE: ${Math.sqrt(a*a + b*b).toFixed(2)}`, type: 'text'});
            };
            const calcRad = (e) => {
                e.preventDefault(); const d = new FormData(e.target);
                const val = parseFloat(d.get('val')); const type = d.get('type');
                let r=0, dia=0, circ=0;
                if(type === 'RAD') { r = val; dia = r*2; circ = 2*Math.PI*r; }
                if(type === 'DIA') { dia = val; r = dia/2; circ = Math.PI*dia; }
                if(type === 'CIRC') { circ = val; dia = circ/Math.PI; r = dia/2; }
                setRes({text: `R: ${r.toFixed(2)} | D: ${dia.toFixed(2)} | C: ${circ.toFixed(2)}`, type: 'text'});
            };
            const calcConv = (e) => {
                e.preventDefault(); const d = new FormData(e.target);
                const val = parseFloat(d.get('val')); const from = d.get('from');
                let out = 0; let unit = '';
                if(from === 'MM_INCH') { out = val / 25.4; unit = 'inch'; }
                if(from === 'INCH_MM') { out = val * 25.4; unit = 'mm'; }
                if(from === 'KG_LBS') { out = val * 2.20462; unit = 'lbs'; }
                if(from === 'LBS_KG') { out = val / 2.20462; unit = 'kg'; }
                setRes({text: `${out.toFixed(3)} ${unit}`, type: 'text'});
            };
            const downloadSvg = (id, name) => {
                const blob = new Blob([document.getElementById(id).outerHTML], {type:"image/svg+xml;charset=utf-8"});
                const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = name;
                document.body.appendChild(link); link.click();
            };
            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return; setUploading(true);
                api.upload(file).then(base64 => { setRes({text: "Image Compressed & Uploading...", type: 'image', img: base64}); setUploading(false); }).catch(err => { console.error(err); setRes({text: "Upload Failed", type: 'error'}); setUploading(false); });
            };

            return (
                <div className="space-y-4 animate-fade-in">
                    <h2 className="font-stencil text-2xl border-b border-surface pb-2">FABRICATOR SUITE</h2>
                    <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
                        {['PIE', 'TRIANGLE', 'RADIUS', 'LEVEL', 'GRID', 'CONVERT', 'CAD', 'SVG', 'NOTCHER', 'WEIGHT', 'ARC', 'TAP', 'NOTES', 'UPLOAD'].map(m => <button key={m} onClick={()=>{
                            vibe();
                            if(m === 'CAD') window.dispatchEvent(new CustomEvent('open-cad'));
                            else { setMode(m); setRes(null); }
                        }} className={`px-2 py-1 text-xs font-bold whitespace-nowrap ${mode===m?'bg-rust text-black':'bg-surface border border-metal'}`}>{m}</button>)}
                    </div>

                    {mode === 'WEIGHT' && (
                        <div className="space-y-4">
                            <div className="flex gap-2">{['PLATE', 'TUBE', 'BAR'].map(t => <button key={t} onClick={()=>setWeightParams({...weightParams, type:t})} className={`flex-1 py-1 text-xs border ${weightParams.type===t?'border-rust text-rust':'border-metal text-metal'}`}>{t}</button>)}</div>
                            {weightParams.type === 'PLATE' && <div className="grid grid-cols-2 gap-2 text-xs"><label>L: <input type="number" value={weightParams.l} onChange={e=>setWeightParams({...weightParams, l:e.target.value})} className="w-full bg-black border border-metal p-2"/></label><label>W: <input type="number" value={weightParams.w} onChange={e=>setWeightParams({...weightParams, w:e.target.value})} className="w-full bg-black border border-metal p-2"/></label><label>Thk: <input type="number" value={weightParams.t} onChange={e=>setWeightParams({...weightParams, t:e.target.value})} className="w-full bg-black border border-metal p-2"/></label></div>}
                            {weightParams.type === 'TUBE' && <div className="grid grid-cols-2 gap-2 text-xs"><label>L: <input type="number" value={weightParams.l} onChange={e=>setWeightParams({...weightParams, l:e.target.value})} className="w-full bg-black border border-metal p-2"/></label><label>OD: <input type="number" value={weightParams.dia} onChange={e=>setWeightParams({...weightParams, dia:e.target.value})} className="w-full bg-black border border-metal p-2"/></label><label>Wall: <input type="number" value={weightParams.wt} onChange={e=>setWeightParams({...weightParams, wt:e.target.value})} className="w-full bg-black border border-metal p-2"/></label></div>}
                            {weightParams.type === 'BAR' && <div className="grid grid-cols-2 gap-2 text-xs"><label>L: <input type="number" value={weightParams.l} onChange={e=>setWeightParams({...weightParams, l:e.target.value})} className="w-full bg-black border border-metal p-2"/></label><label>Dia: <input type="number" value={weightParams.dia} onChange={e=>setWeightParams({...weightParams, dia:e.target.value})} className="w-full bg-black border border-metal p-2"/></label></div>}
                            <button onClick={calcWeight} className="w-full bg-rust py-2 font-bold text-black">CALCULATE WEIGHT</button>
                        </div>
                    )}
                    {mode === 'ARC' && (
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-2 text-xs"><label>Chord: <input type="number" value={arcParams.c} onChange={e=>setArcParams({...arcParams, c:parseFloat(e.target.value)})} className="w-full bg-black border border-metal p-2"/></label><label>Height: <input type="number" value={arcParams.h} onChange={e=>setArcParams({...arcParams, h:parseFloat(e.target.value)})} className="w-full bg-black border border-metal p-2"/></label></div>
                            <button onClick={calcArc} className="w-full bg-rust py-2 font-bold text-black">CALCULATE ARC</button>
                        </div>
                    )}
                    {mode === 'TAP' && <div className="overflow-x-auto"><table className="w-full text-xs text-left"><thead><tr className="border-b border-metal text-rust"><th>TAP</th><th>DRILL</th></tr></thead><tbody className="divide-y divide-metal/30"><tr><td>M3</td><td>2.5</td></tr><tr><td>M4</td><td>3.3</td></tr><tr><td>M5</td><td>4.2</td></tr><tr><td>M6</td><td>5.0</td></tr><tr><td>M8</td><td>6.8</td></tr><tr><td>M10</td><td>8.5</td></tr><tr><td>M12</td><td>10.2</td></tr><tr><td>M16</td><td>14.0</td></tr></tbody></table></div>}
                    {mode === 'PIE' && <div className="space-y-4"><form onSubmit={calcPie} className="space-y-3"><input name="dia" placeholder="Pipe Dia" className="w-full bg-black border border-metal p-2"/><input name="angle" placeholder="Angle" className="w-full bg-black border border-metal p-2"/><input name="seg" placeholder="Segments" className="w-full bg-black border border-metal p-2"/><button className="w-full bg-rust py-2 font-bold text-black">CALCULATE</button></form>{res?.type==='pie' && <div className="border border-metal p-4 bg-black flex flex-col items-center"><svg viewBox="0 0 100 100" className="w-full h-32 stroke-green-500 fill-none stroke-2"><rect x="10" y="20" width="80" height="60" stroke="#333"/><path d={`M10,80 L90,80 L90,${80-(res.angle*2)} L10,80`} fill="rgba(0,255,0,0.2)"/></svg></div>}</div>}
                    {mode === 'TRIANGLE' && <form onSubmit={calcTri} className="space-y-3"><input name="a" placeholder="Side A" className="w-full bg-black border border-metal p-2"/><input name="b" placeholder="Side B" className="w-full bg-black border border-metal p-2"/><button className="w-full bg-rust py-2 font-bold text-black">CALCULATE HYP</button></form>}
                    {mode === 'RADIUS' && <form onSubmit={calcRad} className="space-y-3"><div className="flex gap-2"><input name="val" placeholder="Value" className="flex-1 bg-black border border-metal p-2"/><select name="type" className="bg-black border border-metal p-2 text-white"><option value="RAD">Radius</option><option value="DIA">Diameter</option><option value="CIRC">Circumference</option></select></div><button className="w-full bg-rust py-2 font-bold text-black">CALCULATE ALL</button></form>}
                    {mode === 'CONVERT' && <form onSubmit={calcConv} className="space-y-3"><div className="flex gap-2"><input name="val" placeholder="Value" className="flex-1 bg-black border border-metal p-2"/><select name="from" className="bg-black border border-metal p-2 text-white"><option value="MM_INCH">mm to Inch</option><option value="INCH_MM">Inch to mm</option><option value="KG_LBS">kg to lbs</option><option value="LBS_KG">lbs to kg</option></select></div><button className="w-full bg-rust py-2 font-bold text-black">CONVERT</button></form>}
                    {mode === 'LEVEL' && <div className="text-center space-y-4"><div className="relative w-48 h-48 mx-auto border-4 border-metal rounded-full bg-black flex items-center justify-center overflow-hidden"><div className={`absolute w-[120%] h-1 ${Math.abs(tilt.gamma - refAngle.gamma) < 1 ? 'bg-green-500 shadow-[0_0_10px_#22c55e]' : 'bg-red-500'} transition-transform duration-100`} style={{transform: `rotate(${tilt.gamma - refAngle.gamma}deg)`}}></div></div><div className="font-mono text-xl">ANGLE: {(tilt.gamma - refAngle.gamma).toFixed(1)}°</div><button onClick={()=>setRefAngle(tilt)} className="w-full bg-rust py-2 font-bold text-black">SET ZERO (TARE)</button></div>}
                    {mode === 'GRID' && <div className="space-y-4"><div className="w-full h-48 border border-metal relative overflow-hidden bg-black" style={{backgroundImage: `linear-gradient(to right, #22c55e 1px, transparent 1px), linear-gradient(to bottom, #22c55e 1px, transparent 1px)`, backgroundSize: `${gridSize}px ${gridSize}px`}}></div><input type="range" min="10" max="100" value={gridSize} onChange={e=>setGridSize(e.target.value)} className="w-full accent-green-500"/></div>}
                    {mode === 'SVG' && <div className="space-y-4"><div className="grid grid-cols-2 gap-2 text-xs"><label className="col-span-2">SHAPE <select value={svgParams.shape} onChange={e=>setSvgParams({...svgParams, shape:e.target.value})} className="w-full bg-black border border-metal p-1"><option value="FLANGE">Flange</option><option value="PLATE">Plate</option></select></label>{svgParams.shape === 'FLANGE' && <><label>OD <input type="number" value={svgParams.od} onChange={e=>setSvgParams({...svgParams, od:e.target.value})} className="w-24 bg-black border border-metal p-1"/></label><label>ID <input type="number" value={svgParams.id} onChange={e=>setSvgParams({...svgParams, id:e.target.value})} className="w-24 bg-black border border-metal p-1"/></label></>}{svgParams.shape === 'PLATE' && <><label>W <input type="number" value={svgParams.w} onChange={e=>setSvgParams({...svgParams, w:e.target.value})} className="w-24 bg-black border border-metal p-1"/></label><label>H <input type="number" value={svgParams.h} onChange={e=>setSvgParams({...svgParams, h:e.target.value})} className="w-24 bg-black border border-metal p-1"/></label></>}<label>Holes <input type="number" value={svgParams.holes} onChange={e=>setSvgParams({...svgParams, holes:e.target.value})} className="w-24 bg-black border border-metal p-1"/></label><label>Scale <input type="number" value={svgParams.scale} step="0.1" onChange={e=>setSvgParams({...svgParams, scale:e.target.value})} className="w-24 bg-black border border-metal p-1"/></label></div><div className="w-full h-64 border border-metal overflow-auto relative bg-white"><svg id="gen-svg" width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"><g transform={`scale(${svgParams.scale}) translate(150,150)`}>{svgParams.shape === 'FLANGE' && <><circle r={svgParams.od/2} stroke="black" strokeWidth="2" fill="none" /><circle r={svgParams.id/2} stroke="black" strokeWidth="2" fill="none" /></>}{svgParams.shape === 'PLATE' && <rect x={-svgParams.w/2} y={-svgParams.h/2} width={svgParams.w} height={svgParams.h} stroke="black" strokeWidth="2" fill="none" />}{Array.from({length: svgParams.holes}).map((_,i) => { const angle = (i * 360 / svgParams.holes) * (Math.PI/180); const bc = (parseFloat(svgParams.od) + parseFloat(svgParams.id)) / 4; return <circle key={i} cx={bc * Math.cos(angle)} cy={bc * Math.sin(angle)} r={svgParams.hdia/2} fill="black" /> })}</g></svg></div><button onClick={()=>downloadSvg('gen-svg', 'manku_shape.svg')} className="w-full bg-rust py-2 font-bold text-black">DOWNLOAD SVG</button></div>}
                    {mode === 'NOTCHER' && <div className="space-y-4"><div className="grid grid-cols-3 gap-2 text-xs"><label>Tube OD <input type="number" value={notchParams.tubeOd} onChange={e=>setNotchParams({...notchParams, tubeOd:e.target.value})} className="w-full bg-black border border-metal p-1"/></label><label>Header OD <input type="number" value={notchParams.headerOd} onChange={e=>setNotchParams({...notchParams, headerOd:e.target.value})} className="w-full bg-black border border-metal p-1"/></label><label>Angle <input type="number" value={notchParams.angle} onChange={e=>setNotchParams({...notchParams, angle:e.target.value})} className="w-full bg-black border border-metal p-1"/></label></div><div className="bg-white p-2 overflow-x-auto relative"><svg id="notch-svg" width={Math.PI * notchParams.tubeOd * 3} height={notchParams.tubeOd * 2} viewBox={`0 0 ${Math.PI * notchParams.tubeOd} ${notchParams.tubeOd * 2}`} xmlns="http://www.w3.org/2000/svg"><path d={`M0,${notchParams.tubeOd} ` + Array.from({length: 100}).map((_,i) => { const x = (i/100) * Math.PI * notchParams.tubeOd; const theta = (i/100) * 2 * Math.PI; const alpha = notchParams.angle * (Math.PI/180); return `L${x},${notchParams.tubeOd - ((Math.sin(theta) * notchParams.tubeOd/2) / Math.tan(alpha))}`; }).join(" ") + ` L${Math.PI * notchParams.tubeOd},${notchParams.tubeOd} L0,${notchParams.tubeOd}`} fill="none" stroke="black" strokeWidth="2" /></svg></div><button onClick={()=>downloadSvg('notch-svg', 'notch_template.svg')} className="w-full bg-rust py-2 font-bold text-black">DOWNLOAD TEMPLATE</button></div>}
                    {mode === 'NOTES' && <textarea value={notes} onChange={e=>saveNotes(e.target.value)} className="w-full h-64 bg-black border border-metal p-2 text-white font-mono text-sm resize-none" placeholder="Quick notes..."></textarea>}
                    {mode === 'UPLOAD' && <div className="space-y-4 text-center"><h3 className="font-bold text-white">UPLOAD PHOTO</h3><div className="border-2 border-dashed border-metal p-8 relative"><input type="file" accept="image/*" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />{uploading ? <div className="text-rust animate-pulse">COMPRESSING...</div> : <div className="text-metal">Tap to Select Image</div>}</div><p className="text-xs text-metal">Auto-compressed to 1024px width.</p></div>}
                    {res && res.text && <div className="mt-4 p-4 border border-green-500 text-green-500 font-mono text-center text-lg animate-pulse">{res.text}</div>}
                    {res && res.type === 'image' && <img src={res.img} className="w-full mt-2 border border-white" />}
                </div>
            );
        };

        const ImageCarousel = ({ images, height="h-64" }) => {
            const [idx, setIdx] = useState(0);
            const timerRef = useRef(null);
            useEffect(() => {
                if(!images || images.length <= 1) return;
                timerRef.current = setInterval(() => { setIdx(prev => (prev + 1) % images.length); }, 3000);
                return () => clearInterval(timerRef.current);
            }, [images]);
            if(!images || images.length === 0) return <div className={`w-full ${height} bg-black flex items-center justify-center text-metal`}>No Image</div>;
            return (
                <div className={`w-full ${height} relative group`}>
                    <img src={images[idx]} className="w-full h-full object-cover transition-opacity duration-500" />
                    {images.length > 1 && (
                        <div className="absolute inset-0 flex items-center justify-between p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onClick={(e)=>{e.stopPropagation(); clearInterval(timerRef.current); setIdx(i => i===0 ? images.length-1 : i-1)}} className="bg-black/50 text-white p-1 rounded-full"><ChevronLeft size={20}/></button>
                            <button onClick={(e)=>{e.stopPropagation(); clearInterval(timerRef.current); setIdx(i => (i+1)%images.length)}} className="bg-black/50 text-white p-1 rounded-full"><ChevronRight size={20}/></button>
                        </div>
                    )}
                </div>
            );
        };

        const QuoteModal = ({ job, onClose }) => {
            const materialCost = Math.round(job.cost * 0.7);
            const laborCost = job.cost - materialCost;
            return (
                <div className="fixed inset-0 z-[100] bg-white text-black p-8 overflow-y-auto font-sans">
                    <div className="max-w-[210mm] mx-auto min-h-[297mm] relative flex flex-col justify-between">
                        <div>
                            <button onClick={()=>{vibe(); onClose()}} className="no-print absolute top-0 right-0 bg-black text-white px-4 py-2 font-bold z-[9999]">CLOSE</button>
                            <button onClick={()=>window.print()} className="no-print absolute top-0 right-24 bg-blue-600 text-white px-4 py-2 font-bold">PRINT PDF</button>
                            <div className="flex justify-between items-end border-b-2 border-black pb-4 mb-8">
                                <div><h1 className="text-4xl font-black font-stencil">MANKU METAL WORKS</h1><p>Pune, MH | +91-9999999999</p></div>
                                <div className="text-right"><h2 className="text-2xl font-bold text-gray-400">ESTIMATE</h2><p>#{job.id}</p><p>{job.date}</p></div>
                            </div>
                            <div className="mb-8"><h3 className="font-bold text-sm uppercase text-gray-500">BILL TO</h3><p className="text-xl font-bold">{job.client}</p><p>{job.project}</p></div>
                            <table className="w-full mb-8">
                                <thead><tr className="border-b border-black"><th className="text-left py-2">DESCRIPTION</th><th className="text-right">AMOUNT</th></tr></thead>
                                <tbody>
                                    <tr className="border-b border-gray-200"><td className="py-4">Material Costs (Steel, Consumables)</td><td className="text-right font-mono">₹{materialCost}</td></tr>
                                    <tr className="border-b border-gray-200"><td className="py-4">Fabrication Labor & Overhead</td><td className="text-right font-mono">₹{laborCost}</td></tr>
                                </tbody>
                            </table>
                            <div className="text-right text-2xl font-bold border-t-2 border-black pt-4">TOTAL: ₹{job.cost}</div>
                        </div>
                    </div>
                </div>
            );
        };

        const PaymentModal = ({ job, onClose }) => {
            return (
                <div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4">
                    <div className="bg-surface border-2 border-rust w-full max-w-sm p-6 relative">
                        <button onClick={()=>{vibe(); onClose()}} className="absolute top-2 right-2 text-metal hover:text-white z-[9999]"><X size={20}/></button>
                        <h3 className="font-stencil text-xl mb-4">MAKE PAYMENT</h3>
                        <div className="mb-4"><p className="text-sm font-bold">{job.project}</p><p className="text-xs text-metal">Amount Due: <span className="text-rust">₹{job.cost}</span></p></div>
                        <form onSubmit={e=>{e.preventDefault(); window.showToast("Payment Successful!", "success"); vibe(); onClose();}} className="space-y-3">
                            <input placeholder="Card Number" className="w-full bg-black border border-metal p-2 text-white" />
                            <div className="flex gap-2"><input placeholder="MM/YY" className="w-1/2 bg-black border border-metal p-2 text-white" /><input placeholder="CVC" className="w-1/2 bg-black border border-metal p-2 text-white" /></div>
                            <button className="w-full bg-rust py-3 font-bold text-black flex items-center justify-center gap-2"><CreditCard size={16}/> PAY NOW</button>
                        </form>
                    </div>
                </div>
            );
        };

        const RequestModal = ({ type, onClose }) => {
            const title = {APPT: "SCHEDULE APPOINTMENT", QUOTE: "REQUEST QUOTE", PICKUP: "REQUEST PICKUP"}[type];
            const handleSubmit = async (e) => {
                e.preventDefault();
                vibe();
                const d = new FormData(e.target);

                                    <div className="flex justify-between items-center mt-2">
                                        <span>Theme Mode</span>
                                        <select value={data.settings?.theme || 'dark'} onChange={e=>window.mockFetch('/api/settings', {method:'PUT', body:JSON.stringify({theme: e.target.value})}).then(refreshData)} className="bg-black border border-metal px-3 py-1 text-xs text-white">
                                            <option value="dark">Standard (Dark)</option>
                                            <option value="light">Light Mode</option>
                                            <option value="festival">Festival (Promotional)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {loginOpen && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-surface border-2 border-rust w-full max-w-sm p-6 relative">
                                <button onClick={()=>setLoginOpen(false)} className="absolute top-2 right-2 text-metal hover:text-white z-[9999]"><X size={20}/></button>
                                <h2 className="font-stencil text-2xl text-rust mb-4">LOGIN</h2>
                                <form onSubmit={(e)=>{login(e); setLoginOpen(false);}} className="space-y-4">
                                    <input name="user" type="tel" placeholder="Client ID / Phone" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <input name="pass" type="password" placeholder="Password" required className="w-full bg-black border border-metal p-2 text-white" />
                                    <button className="w-full bg-rust py-3 font-bold text-black">ACCESS PORTAL</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {hud && <FabricatorHUD onClose={()=>setHud(false)} />}
                    {cadOpen && <CadDesigner job={cadJob} activeJobs={activeJobs} onClose={()=>setCadOpen(false)} onSave={async (shapes, targetJobId)=>{
                        if(targetJobId) {
                             await window.mockFetch(`/api/jobs/${targetJobId}`, {method:'PUT', body:JSON.stringify({design: shapes})});
                             refreshData(); window.showToast("Design Saved to Job!", "success");
                        } else {
                             const name = prompt("Enter Template Name:");
                             if(name) { await window.mockFetch('/api/templates', {method:'POST', body:JSON.stringify({name, cost: 0, design: shapes})}); refreshData(); window.showToast("Template Saved!", "success"); }
                        }
                        setCadOpen(false);
                    }} />}
                    {quoteJob && <QuoteModal job={quoteJob} onClose={()=>setQuoteJob(null)} />}

                    {toast && (
                        <div className={`fixed bottom-20 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full font-bold shadow-lg z-[100] ${toast.type==='error'?'bg-red-600 text-white':'bg-green-500 text-black'}`}>
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
